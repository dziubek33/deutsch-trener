/* Deutsch-Trener: wygląd w stylu „zielono-białym” (jasna zieleń + biel, zaokrąglone kształty, przyciski 3D).
   Motyw: jasny (domyślny), ciemny albo zgodny z systemem; wybór w Ustawieniach (atrybut data-motyw na <html>).
   Telefon (≤ 860 px): dolny pasek zakładek i szuflada „Więcej”; klasa „dotyk” na <html>: pasek ä ö ü ß nad klawiaturą. */
:root {
  --tlo: #ffffff;
  --tlo2: #f7f7f7;
  --pasek: #ffffff;
  --panel: #ffffff;
  --tekst: #3c3c3c;
  --tekst2: #6f6f6f;
  --tekst3: #a8a8a8;
  --linia: #e5e5e5;
  --linia-mocna: #d7d7d7;
  --akcent: #58cc02;
  --akcent-mocny: #61d80a;
  --akcent-cien: #46a302;
  --akcent-tlo: #eafbdc;
  --akcent-tekst: #2f8a00;
  --ok: #4b9e00;
  --ok-tlo: #d7ffb8;
  --blad: #e02424;
  --blad-tlo: #ffdfe0;
  --blad-cien: #c21b1b;
  --uwaga: #c98700;
  --uwaga-tlo: #fff4c7;
  --pomarancz: #ff9600;
  --pomarancz-cien: #e08400;
  --niebieski: #1cb0f6;
  --niebieski-cien: #1899d6;
  --niebieski-tlo: #ddf4ff;
  --praet: #9a4ee0;
  --perf: #0a9b8c;
  --ist: #f07c00;
  --hat: #1899d6;
  --promien: 18px;
  --promien-maly: 13px;
  --marka-tekst: #25313a;
  color-scheme: light;
}
:root[data-motyw="ciemny"] {
  --marka-tekst: #e5edf1;
  --tlo: #131f24;
  --tlo2: #1b2a31;
  --pasek: #131f24;
  --panel: #18262c;
  --tekst: #eef5f8;
  --tekst2: #a6b5bd;
  --tekst3: #6e7f88;
  --linia: #37464f;
  --linia-mocna: #2a383f;
  --akcent: #58cc02;
  --akcent-mocny: #61d80a;
  --akcent-cien: #46a302;
  --akcent-tlo: #1d3613;
  --akcent-tekst: #7fe032;
  --ok: #7fd63a;
  --ok-tlo: #1f3a12;
  --blad: #ff6b6b;
  --blad-tlo: #3d1f22;
  --blad-cien: #b83a3a;
  --uwaga: #f4bf3f;
  --uwaga-tlo: #3b3216;
  --niebieski-tlo: #16313d;
  --praet: #c79bff;
  --perf: #3fd1bf;
  --ist: #ffad47;
  --hat: #6fd0ff;
  color-scheme: dark;
}
/* Projekty angielskie: niebieski wygląd jak w trenerze do kartkówki z angielskiego; niemieckie zostają zielone.
   Tryb ciemny działa z oboma kolorami (data-jezyk ustawia układ przy każdym ekranie). */
:root[data-jezyk="en"] {
  --tlo: #f3f7fa;
  --tlo2: #eaf1f6;
  --pasek: #f3f7fa;
  --akcent: #1cb0f6;
  --akcent-mocny: #3dbdf8;
  --akcent-cien: #1584bd;
  --akcent-tlo: #ddf4ff;
  --akcent-tekst: #0a6a9a;
}
:root[data-motyw="ciemny"][data-jezyk="en"] {
  --tlo: #0f181d;
  --tlo2: #17252d;
  --pasek: #0f181d;
  --panel: #17252d;
  --linia: #29404c;
  --linia-mocna: #36525f;
  --akcent: #1cb0f6;
  --akcent-mocny: #3dbdf8;
  --akcent-cien: #1584bd;
  --akcent-tlo: #0c3245;
  --akcent-tekst: #8ad7fb;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--tlo);
  color: var(--tekst);
  font: 500 17px/1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .6em; font-weight: 800; }
h2 { font-size: 1.3rem; }
strong { font-weight: 800; }
a { color: var(--akcent-tekst); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--niebieski) 60%, transparent); outline-offset: 2px; }

.ikona { display: inline-flex; width: 1.2em; height: 1.2em; flex: none; }
.ikona svg { width: 100%; height: 100%; }

/* ---------- układ ---------- */
#app { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
.pasek {
  background: var(--pasek); border-right: 2px solid var(--linia);
  padding: 22px 14px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.marka { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.marka .logo { width: 48px; height: 48px; flex: none; }
.logo svg { width: 100%; height: 100%; display: block; }
.marka strong { display: block; font-size: 1.2rem; font-weight: 900; color: var(--marka-tekst); letter-spacing: -.01em; }
.marka small { color: var(--tekst2); font-size: .8rem; }
.pasek-sekcja { display: flex; flex-direction: column; gap: 4px; }
.pasek-dol { margin-top: auto; }
.pasek-tytul { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--tekst3); padding: 0 10px 4px; font-weight: 800; }
.projekt-poz, .pasek-akcja {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 2px solid transparent; background: transparent; padding: 9px 12px; border-radius: 12px; cursor: pointer; color: var(--tekst); font-weight: 700;
}
.projekt-poz:hover, .pasek-akcja:hover { background: var(--tlo2); }
.projekt-poz.aktywny { background: var(--akcent-tlo); border-color: color-mix(in srgb, var(--akcent) 55%, transparent); color: var(--akcent-tekst); }
.projekt-nazwa { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.projekt-licznik { font-size: .8rem; color: var(--tekst3); }
.pasek-akcja { color: var(--tekst2); font-size: .92rem; }
.archiwum summary { cursor: pointer; color: var(--tekst2); padding: 6px 12px; font-size: .9rem; font-weight: 700; }
.kopia-info, .ostrzezenie { padding: 2px 12px; color: var(--tekst3); font-size: .8rem; }
.kopia-info.zapis-ok { color: var(--akcent-tekst); font-weight: 700; }
.ostrzezenie { color: var(--blad); }

.glowna { min-width: 0; padding: 22px 36px 60px; }
.naglowek { max-width: 1040px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.naglowek h1 { font-size: 1.65rem; margin: 0; }
.zakladki { display: flex; gap: 6px; flex-wrap: wrap; }
.zakladka {
  display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 13px; text-decoration: none;
  color: var(--tekst2); font-size: .92rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  border: 2px solid transparent;
}
.zakladka:hover { background: var(--tlo2); color: var(--tekst); }
.zakladka.aktywna { background: var(--akcent-tlo); color: var(--akcent-tekst); border-color: color-mix(in srgb, var(--akcent) 60%, transparent); }
.ekran { max-width: 1040px; margin: 0 auto; outline: none; }
#baner { max-width: 1040px; margin: 0 auto; }
.baner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--uwaga-tlo); border: 2px solid color-mix(in srgb, var(--uwaga) 45%, transparent);
  padding: 10px 14px; border-radius: var(--promien-maly); margin-bottom: 16px; font-weight: 700;
}
.baner span { flex: 1; min-width: 240px; }

/* ---------- elementy wspólne ---------- */
.karta-panel {
  background: var(--panel); border: 2px solid var(--linia); border-radius: var(--promien);
  padding: 22px 24px; margin-bottom: 18px;
}
.karta-panel.wyroznij { border-color: var(--akcent); }
.przycisk {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid var(--linia); background: var(--panel); color: var(--tekst2);
  padding: 9px 16px; border-radius: var(--promien-maly); cursor: pointer; font-weight: 800;
  box-shadow: 0 3px 0 var(--linia); transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
  text-transform: uppercase; letter-spacing: .04em; font-size: .9rem;
}
.przycisk:hover { filter: brightness(1.03); background: var(--tlo2); }
.przycisk:active { transform: translateY(3px); box-shadow: 0 0 0 var(--linia); }
.przycisk:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.przycisk.glowny { background: var(--akcent); border-color: var(--akcent); color: #fff; box-shadow: 0 4px 0 var(--akcent-cien); }
.przycisk.glowny:hover { background: var(--akcent-mocny); border-color: var(--akcent-mocny); }
.przycisk.glowny:active { box-shadow: 0 0 0 var(--akcent-cien); transform: translateY(4px); }
.przycisk.niebezpieczny { color: var(--blad); border-color: color-mix(in srgb, var(--blad) 40%, transparent); box-shadow: 0 3px 0 color-mix(in srgb, var(--blad) 30%, transparent); }
.przycisk.niebezpieczny:hover { background: var(--blad-tlo); }
.przycisk.maly { padding: 6px 11px; font-size: .78rem; box-shadow: 0 2px 0 var(--linia); }
.przycisk.glowny.maly { box-shadow: 0 3px 0 var(--akcent-cien); }
.przycisk.duzy { padding: 13px 26px; font-size: 1rem; }
.przycisk.ogromny { padding: 18px 46px; font-size: 1.3rem; border-radius: 16px; margin-top: 12px; box-shadow: 0 5px 0 var(--akcent-cien); }
.przycisk.ogromny:active { transform: translateY(5px); }
.ikona-przycisk { border: 0; background: transparent; color: var(--niebieski); cursor: pointer; padding: 4px; border-radius: 10px; vertical-align: middle; }
.ikona-przycisk:hover { background: var(--niebieski-tlo); }
.przyciski { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.pole {
  width: 100%; padding: 11px 13px; border: 2px solid var(--linia); border-radius: var(--promien-maly);
  background: var(--tlo2); color: var(--tekst); font-weight: 600;
}
.pole:focus { border-color: var(--akcent); background: var(--panel); outline: none; box-shadow: 0 0 0 3px var(--akcent-tlo); }
select.pole.maly { width: auto; padding: 4px 8px; }
.etykieta { display: flex; flex-direction: column; gap: 6px; font-size: .92rem; color: var(--tekst2); font-weight: 700; }
.siatka-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 14px; }
fieldset { border: 2px solid var(--linia); border-radius: var(--promien-maly); padding: 10px 14px 12px; margin: 0 0 14px; }
legend { padding: 0 6px; color: var(--tekst2); font-size: .9rem; font-weight: 800; }
.wybor { display: inline-flex; align-items: center; gap: 8px; margin: 4px 18px 4px 0; cursor: pointer; font-weight: 600; }
.wybor input { accent-color: var(--akcent); width: 18px; height: 18px; }
.przypis, .podpowiedz-klaw { color: var(--tekst3); font-size: .85rem; font-weight: 500; }
.podpowiedz-klaw { display: block; margin-top: 10px; }
.pusto { color: var(--tekst3); }
.link { color: var(--akcent-tekst); font-weight: 700; }
.postep-pasek { position: relative; height: 16px; background: var(--linia); border-radius: 99px; overflow: hidden; }
.postep-wypelnienie { position: relative; height: 100%; background: var(--akcent); border-radius: 99px; transition: width .4s ease; min-width: 0; }
.postep-wypelnienie::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .35); }
.znaczek { display: inline-block; font-size: .74rem; padding: 2px 9px; border-radius: 99px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.znaczek.nowe { background: var(--tlo2); color: var(--tekst2); border: 2px solid var(--linia); }
.znaczek.nauka { background: var(--uwaga-tlo); color: var(--uwaga); }
.znaczek.opanowane { background: var(--ok-tlo); color: var(--ok); }
.tabela { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tabela th, .tabela td { text-align: left; padding: 9px 10px; border-bottom: 2px solid var(--linia); vertical-align: top; }
.tabela th { color: var(--tekst2); font-weight: 800; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; background: var(--tlo2); }
.tabela-przewijana { max-height: 62vh; overflow: auto; border: 2px solid var(--linia); border-radius: var(--promien-maly); }
.tabela-przewijana.niska { max-height: 280px; }

/* formy i kolory */
.forma.veraltet { color: var(--tekst2); }
.dopisek { color: var(--tekst3); font-style: italic; font-weight: 500; }
.forma.dodatkowa { color: var(--tekst2); }
.ukosnik { color: var(--tekst3); }
.aux { font-weight: 800; }
.aux-ist { color: var(--ist); }
.aux-hat { color: var(--hat); }
.pole-praeteritum .formy, .pole-praeteritum th, td.pole-praeteritum { color: var(--praet); }
.pole-perfekt th { color: var(--perf); }
.pole-perfekt .formy .forma > span, td.pole-perfekt { color: var(--perf); }
.formy-tabela { border-collapse: collapse; font-size: 1.2rem; }
.formy-tabela th { text-align: left; font-weight: 800; color: var(--tekst2); font-size: .8rem; padding: 6px 18px 6px 0; vertical-align: baseline; text-transform: uppercase; letter-spacing: .05em; }
.formy-tabela td { padding: 6px 0; font-weight: 800; }
.znaczenie + .znaczenie { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--linia); }
.znaczenie-opis { color: var(--tekst2); font-style: italic; font-size: .92rem; margin-bottom: 2px; }

/* ---------- Dziś ---------- */
.dzis-gora { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: stretch; margin-bottom: 18px; }
.powitanie { display: flex; align-items: center; gap: 14px; }
.powitanie .maskotka { width: 90px; height: 90px; flex: none; }
.dymek {
  position: relative; background: var(--panel); border: 2px solid var(--linia); border-radius: 18px;
  padding: 14px 18px; font-size: 1.08rem; font-weight: 700;
}
.dymek::before {
  content: ""; position: absolute; left: -10px; top: 50%; width: 16px; height: 16px; background: var(--panel);
  border-left: 2px solid var(--linia); border-bottom: 2px solid var(--linia); transform: translateY(-50%) rotate(45deg);
}
.odliczanie {
  background: var(--akcent); color: #fff; border-radius: var(--promien); padding: 18px 26px; min-width: 270px;
  box-shadow: 0 5px 0 var(--akcent-cien);
}
.odliczanie-etyk { opacity: .95; font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.odliczanie-czas { font-size: 2.1rem; font-weight: 900; letter-spacing: -.01em; }
.odliczanie-czas.male { font-size: 1.4rem; }
.odliczanie-data { opacity: .95; font-weight: 700; }
.odliczanie .link { color: #fff; }
.plan { text-align: center; padding: 28px 24px; }
.plan-tekst { font-size: 1.2rem; margin: 0 0 14px; font-weight: 700; }
.cel-dnia { max-width: 440px; margin: 0 auto; }
.cel-dnia small { color: var(--tekst2); font-weight: 700; }
.pasek-postepu-3 { display: flex; height: 18px; border-radius: 99px; overflow: hidden; background: var(--linia); }
.seg { height: 100%; transition: width .5s ease; }
.seg.opanowane, .kropka.opanowane { background: var(--akcent); }
.seg.nauka, .kropka.nauka { background: #ffc800; }
.seg.nowe, .kropka.nowe { background: var(--linia-mocna); }
.legenda { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; color: var(--tekst2); font-size: .92rem; font-weight: 700; }
.kropka { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
.tydzien { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.dzien { border: 2px solid var(--linia); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; font-size: .85rem; box-shadow: 0 3px 0 var(--linia); }
.dzien strong { font-size: .95rem; }
.dzien span { color: var(--tekst2); font-weight: 600; }
.dzien small { color: var(--akcent-tekst); font-weight: 800; }
.dzien.dzis { border-color: var(--akcent); background: var(--akcent-tlo); box-shadow: 0 3px 0 var(--akcent-cien); }
.dzien.przeszly { opacity: .55; }
.lista-wynikow { list-style: none; padding: 0; margin: 0; }
.lista-wynikow li { display: flex; gap: 14px; align-items: baseline; padding: 7px 0; border-bottom: 2px solid var(--linia); }
.lista-wynikow li span { flex: 1; color: var(--tekst2); }

/* ---------- sesja, fiszki ---------- */
.sesja-gora { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.sesja-gora .postep-pasek { flex: 1; }
.sesja-nazwa { font-weight: 800; }
.sesja-licznik { color: var(--tekst2); font-variant-numeric: tabular-nums; font-weight: 700; }
.fiszka-scena { perspective: 1400px; max-width: 720px; margin: 0 auto; }
.fiszka {
  position: relative; min-height: 340px; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2, .7, .2, 1);
  cursor: pointer; border-radius: 22px; outline: none;
}
.fiszka.odwrocona { transform: rotateY(180deg); }
.strona {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--panel); border: 2px solid var(--linia); border-radius: 22px; box-shadow: 0 5px 0 var(--linia);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px; overflow: auto;
}
.fiszka:focus-visible { outline: none; }
.strona.tyl { transform: rotateY(180deg); justify-content: flex-start; }
.fiszka-etykieta { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--akcent-tekst); margin-bottom: 6px; font-weight: 800; }
.fiszka-slowo { font-size: 2.9rem; font-weight: 900; letter-spacing: -.01em; text-align: center; }
.fiszka-slowo.male { font-size: 1.75rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.fiszka-pod { color: var(--tekst2); margin-top: 4px; font-weight: 700; }
.fiszka-wskazowka { color: var(--tekst3); font-size: .85rem; margin-top: 22px; }
.notatka-podglad { margin-top: 14px; background: var(--uwaga-tlo); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
.oceny { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
.oceny[hidden] { display: none; }
.ocena {
  --kolor: var(--tekst2);
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px;
  border-radius: 15px; border: 2px solid color-mix(in srgb, var(--kolor) 45%, var(--linia)); background: var(--panel); cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--kolor) 45%, var(--linia)); transition: transform .06s ease, box-shadow .06s ease;
}
.ocena:active { transform: translateY(4px); box-shadow: none; }
.ocena-klawisz { font-size: .72rem; color: var(--tekst3); border: 2px solid var(--linia); border-radius: 7px; padding: 0 6px; font-weight: 800; }
.ocena-nazwa { font-weight: 900; color: var(--kolor); text-transform: uppercase; letter-spacing: .04em; }
.ocena small { color: var(--tekst3); font-size: .78rem; font-weight: 700; }
.ocena-1 { --kolor: var(--blad); }
.ocena-2 { --kolor: var(--pomarancz); }
.ocena-3 { --kolor: var(--akcent); }
.ocena-4 { --kolor: var(--niebieski); }

/* ---------- pisanie ---------- */
.pisanie { max-width: 900px; margin: 0 auto; background: var(--panel); border: 2px solid var(--linia); border-radius: 22px; padding: 26px 28px; box-shadow: 0 5px 0 var(--linia); }
.pisanie-pytanie { text-align: center; margin-bottom: 12px; }
.pytanie-slowo { font-size: 2.7rem; font-weight: 900; display: inline-flex; align-items: center; gap: 8px; }
.pytanie-pod { color: var(--tekst2); font-size: .92rem; font-weight: 600; }
.pytanie-etyk { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--tekst3); font-weight: 800; }
.pytanie-slowo.pytanie-pl { color: var(--akcent-tekst); }
.pytanie-glos { display: inline-flex; align-items: center; gap: 16px; text-align: left; padding: 6px 0; }
.pytanie-glos strong { display: block; font-size: 1.2rem; }
.pytanie-glos small { color: var(--tekst3); font-weight: 600; }
.przycisk-glos {
  width: 84px; height: 84px; border-radius: 22px; border: 0; cursor: pointer; color: #fff;
  background: var(--niebieski); box-shadow: 0 5px 0 var(--niebieski-cien); display: grid; place-items: center;
  transition: transform .06s ease, box-shadow .06s ease;
}
.przycisk-glos .ikona { width: 44px; height: 44px; }
.przycisk-glos:active { transform: translateY(5px); box-shadow: none; }
.przycisk-odsluch { color: var(--niebieski); border-color: color-mix(in srgb, var(--niebieski) 45%, var(--linia)); }
.znaczek-ai { display: inline-block; margin-left: 8px; font-size: .66rem; font-weight: 900; letter-spacing: .06em; color: var(--niebieski-cien); background: var(--niebieski-tlo); border-radius: 6px; padding: 1px 6px; vertical-align: middle; }
.wynik-uwaga { color: var(--uwaga); font-size: .85rem; font-weight: 700; width: 100%; }
.umlauty { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0 16px; flex-wrap: wrap; }
.umlaut {
  min-width: 46px; padding: 6px 10px; font-size: 1.2rem; font-weight: 800; border-radius: 12px;
  border: 2px solid var(--linia); background: var(--panel); cursor: pointer; box-shadow: 0 3px 0 var(--linia);
}
.umlaut:hover { border-color: var(--akcent); color: var(--akcent-tekst); }
.umlaut:active { transform: translateY(3px); box-shadow: none; }
.umlauty .podpowiedz-klaw { margin: 0 0 0 6px; display: inline; }
.pisanie-wiersz + .pisanie-wiersz { margin-top: 14px; padding-top: 14px; border-top: 2px dashed var(--linia); }
.wiersz-opis { color: var(--tekst2); font-style: italic; margin-bottom: 6px; }
.pisanie-siatka { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.pisanie-pole { display: flex; flex-direction: column; gap: 6px; }
.pole-etykieta { font-weight: 800; display: flex; flex-direction: column; text-transform: uppercase; letter-spacing: .04em; font-size: .9rem; }
.pole-etykieta small { font-weight: 600; color: var(--tekst3); font-size: .76rem; text-transform: none; letter-spacing: 0; }
.pole-praeteritum .pole-etykieta { color: var(--praet); }
.pole-perfekt .pole-etykieta { color: var(--perf); }
.pole.odpowiedz { font-size: 1.35rem; padding: 12px 14px; font-weight: 700; }
.pole.odpowiedz.dobrze { border-color: var(--akcent); background: var(--ok-tlo); color: var(--ok); }
.pole.odpowiedz.zle { border-color: var(--blad); background: var(--blad-tlo); color: var(--blad); }
.pole-wynik { min-height: 4px; font-size: .95rem; }
.wynik-ok { color: var(--ok); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-weight: 800; }
.inne-warianty { color: var(--tekst2); font-size: .85rem; font-weight: 600; }
.wynik-zle { display: flex; flex-direction: column; gap: 3px; }
.wynik-linia { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.wynik-etyk { color: var(--tekst3); font-size: .78rem; min-width: 52px; font-weight: 800; text-transform: uppercase; }
.wynik-opis { color: var(--blad); font-size: .88rem; font-weight: 700; }
.diff { font-weight: 800; letter-spacing: .01em; }
mark.zle { background: var(--blad-tlo); color: var(--blad); text-decoration: underline wavy var(--blad); border-radius: 4px; padding: 0 1px; }
mark.brak { background: var(--ok-tlo); color: var(--ok); border-radius: 4px; padding: 0 1px; }
.pisanie-podsumowanie { margin-top: 16px; }
.werdykt { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 14px; border-radius: 15px; font-weight: 900; font-size: 1.1rem; }
.werdykt .ikona { width: 1.5em; height: 1.5em; }
.werdykt.dobrze { background: var(--ok-tlo); color: var(--ok); }
.werdykt.zle { background: var(--blad-tlo); color: var(--blad); }
.pisanie-akcje { text-align: center; margin-top: 16px; }

/* ---------- podsumowanie sesji ---------- */
.podsumowanie { text-align: center; background: var(--panel); border: 2px solid var(--linia); border-radius: 22px; padding: 30px; box-shadow: 0 5px 0 var(--linia); max-width: 760px; margin: 0 auto; }
.podsumowanie h2 { color: var(--akcent-tekst); font-size: 1.7rem; }
.podsumowanie .maskotka { width: 104px; height: 104px; margin: 0 auto 6px; }
.podsumowanie .przyciski { justify-content: center; }
.kafle { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
.kafel { border: 2px solid var(--linia); border-radius: 15px; padding: 14px; display: flex; flex-direction: column; }
.kafel strong { font-size: 1.7rem; color: var(--akcent-tekst); }
.kafel span { color: var(--tekst2); font-size: .9rem; font-weight: 700; }
.przypomnienie { background: var(--uwaga-tlo); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 700; }

/* ---------- symulator ---------- */
.quiz-gora {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  background: var(--panel); border: 2px solid var(--linia); border-radius: var(--promien); padding: 10px 16px; margin-bottom: 14px; font-weight: 700;
}
.quiz-gora .umlauty { margin: 0; flex: 1; justify-content: flex-start; }
.zegar { font-variant-numeric: tabular-nums; font-size: 1.2rem; color: var(--akcent-tekst); }
.zegar.malo { color: var(--blad); }
.quiz-naglowek, .quiz-wiersz { display: grid; grid-template-columns: 34px 180px 1fr; gap: 10px; align-items: start; }
.quiz-naglowek { color: var(--tekst3); font-size: .76rem; padding: 0 14px 4px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.quiz-pola-nag, .quiz-pola-wiersz { display: grid; grid-template-columns: repeat(var(--kolumny, 3), 1fr); gap: 10px; }
.quiz-wiersz { background: var(--panel); border: 2px solid var(--linia); border-radius: 15px; padding: 10px 14px; margin-bottom: 8px; }
.quiz-nr { color: var(--tekst3); padding-top: 8px; font-variant-numeric: tabular-nums; font-weight: 800; }
.quiz-slowo { font-weight: 900; font-size: 1.12rem; padding-top: 7px; }
.quiz-pola { display: flex; flex-direction: column; gap: 6px; }
.quiz-pola-wiersz .wiersz-opis { grid-column: 1 / -1; margin: 0; font-size: .82rem; }
.quiz-pola-wiersz .pole.odpowiedz { font-size: 1.05rem; padding: 8px 10px; }
.wynik-glowny { display: flex; align-items: center; gap: 20px; }
.wynik-glowny .maskotka { width: 96px; height: 96px; }
.wynik-proc { font-size: 3rem; font-weight: 900; color: var(--akcent-tekst); }
.raport-wiersz { display: grid; grid-template-columns: 200px 1fr; gap: 12px; padding: 10px 0; border-bottom: 2px solid var(--linia); }
.raport-wiersz.ok .raport-slowo { color: var(--ok); }
.raport-wiersz.zle .raport-slowo { color: var(--blad); }
.raport-slowo { font-weight: 900; display: flex; align-items: center; gap: 6px; }
.raport-pola { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.raport-pole { font-size: .92rem; }
.raport-pole small:first-child { display: block; color: var(--tekst3); font-weight: 800; text-transform: uppercase; font-size: .72rem; }
.raport-pole.zle { background: var(--blad-tlo); border-radius: 12px; padding: 6px 8px; }

/* ---------- karty ---------- */
.filtry { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filtry .pole { width: auto; flex: 1; min-width: 160px; }
.wiersz-karty { cursor: pointer; }
.wiersz-karty:hover { background: var(--akcent-tlo); }
.wiersz-karty.otwarta { background: var(--akcent-tlo); }
.tabela-kart td.inf { font-weight: 800; }
.tabela-kart td.mniej { color: var(--tekst3); font-size: .85rem; }
.flaga { color: var(--uwaga); margin-left: 6px; }
td.pole-pl { color: var(--akcent-tekst); font-weight: 700; }
.tlumaczenia-edycja { border: 2px solid var(--linia); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.etykieta.male { font-size: .82rem; }
.karta-szczegoly { padding: 10px 4px; }
.szczegoly-kolumny { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.skan { max-width: 100%; margin-top: 12px; border-radius: 10px; border: 2px solid var(--linia); }
.srs-info { font-size: .9rem; color: var(--tekst2); margin: 10px 0; display: flex; flex-direction: column; gap: 3px; }
.kropka-wynik { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; }
.kropka-wynik.ok { background: var(--akcent); }
.kropka-wynik.zle { background: var(--blad); }
.do-sprawdzenia-poz { background: var(--uwaga-tlo); border-radius: 12px; padding: 8px 12px; margin-top: 10px; font-size: .9rem; }
.zrodlo-info { color: var(--tekst3); font-size: .85rem; }
details.do-sprawdzenia summary { cursor: pointer; color: var(--akcent-tekst); font-weight: 800; }
details.do-sprawdzenia li { margin: 8px 0; }

/* ---------- ustawienia, projekty ---------- */
.przelacznik { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 2px solid var(--linia); cursor: pointer; }
.przelacznik:last-child { border-bottom: 0; }
.przelacznik input { margin-top: 4px; width: 19px; height: 19px; accent-color: var(--akcent); flex: none; }
.przelacznik-tekst { display: flex; flex-direction: column; }
.przelacznik-tekst small { color: var(--tekst2); font-weight: 500; }
.lista-info { color: var(--tekst2); font-size: .93rem; }
.karta-panel details { margin-top: 14px; }
.karta-panel details summary { cursor: pointer; font-weight: 700; color: var(--tekst2); }
.lista-projektow { list-style: none; padding: 0; margin: 0; }
.projekt-wiersz { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 2px solid var(--linia); flex-wrap: wrap; }
.projekt-wiersz.aktywny strong { color: var(--akcent-tekst); }
.projekt-opis { display: flex; flex-direction: column; }
.projekt-opis small { color: var(--tekst3); }
.projekt-akcje { display: flex; gap: 6px; flex-wrap: wrap; }
.ostrzezenia { font-size: .85rem; color: var(--uwaga); max-height: 160px; overflow: auto; }
.licznik-kart { color: var(--tekst2); font-weight: 700; }
.stopka { text-align: center; margin-top: 24px; }

/* ---------- maskotka, okna, toasty, konfetti ---------- */
.maskotka svg { width: 100%; height: 100%; display: block; }
.okno-tlo { position: fixed; inset: 0; background: rgba(20, 30, 20, .45); display: grid; place-items: center; z-index: 50; padding: 20px; animation: pojaw .15s ease; }
.okno { background: var(--panel); border: 2px solid var(--linia); border-radius: 22px; padding: 24px 26px; max-width: 640px; width: 100%; max-height: 88vh; overflow: auto; box-shadow: 0 6px 0 var(--linia), 0 24px 60px rgba(0, 0, 0, .25); }
.okno-tresc { color: var(--tekst2); }
.okno-przyciski { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.powitanie-okno { display: flex; gap: 16px; align-items: flex-start; }
.powitanie-okno .maskotka { width: 76px; height: 76px; flex: none; }
.powitanie-okno ul { margin: 0; padding-left: 18px; }
.powitanie-okno li { margin-bottom: 6px; }
#toasty { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--tekst); color: var(--tlo); padding: 11px 17px; border-radius: 14px; max-width: 380px; animation: pojaw .2s ease; transition: opacity .4s ease; font-weight: 700; }
.toast.ok { background: var(--akcent); color: #fff; box-shadow: 0 4px 0 var(--akcent-cien); }
.toast.blad { background: var(--blad); color: #fff; box-shadow: 0 4px 0 var(--blad-cien); }
.toast.znika { opacity: 0; }
.konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.konfetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation-name: spadaj; animation-timing-function: cubic-bezier(.3, .6, .5, 1); animation-fill-mode: forwards; }
@keyframes spadaj { to { transform: translateY(105vh) rotate(720deg); opacity: .8; } }
@keyframes pojaw { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fiszka { transition: none; } * { animation: none !important; } }

/* ---------- gry ---------- */
.baner-info { background: var(--niebieski-tlo); border-color: color-mix(in srgb, var(--niebieski) 45%, transparent); }
.gry-lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.gra-karta { border: 2px solid var(--linia); border-radius: var(--promien); padding: 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 0 var(--linia); background: var(--panel); }
.gra-karta h3 { margin: 0; font-size: 1.15rem; color: var(--akcent-tekst); }
.gra-karta p { margin: 0; color: var(--tekst2); flex: 1; }
.gra-karta small { color: var(--tekst3); font-weight: 700; }
.gra-naglowek { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.gra-naglowek h2 { margin: 0; flex: 1; }
.gra-naglowek-prawa { display: flex; gap: 14px; align-items: center; font-weight: 700; }
.gra-panel { background: var(--panel); border: 2px solid var(--linia); border-radius: 22px; padding: 24px; box-shadow: 0 5px 0 var(--linia); max-width: 820px; margin: 0 auto; }
.sprint-gora { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.gra-czas { font-size: 2.4rem; font-weight: 900; color: var(--akcent-tekst); font-variant-numeric: tabular-nums; }
.gra-czas.malo { color: var(--blad); }
.mnoznik { background: var(--uwaga-tlo); color: var(--uwaga); border-radius: 99px; padding: 2px 10px; font-weight: 900; }
.sprint-etyk { text-align: center; font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; color: var(--tekst3); font-weight: 900; }
.sprint-slowo { text-align: center; font-size: 2.4rem; font-weight: 900; margin: 4px 0 6px; min-height: 60px; }
.sprint-pole { max-width: 460px; margin: 0 auto; }
.sprint-info { text-align: center; min-height: 32px; margin-top: 10px; }
.sprint-info .wynik-zle { flex-direction: row; justify-content: center; gap: 8px; }
.przycisk-glos.maly { width: 60px; height: 60px; border-radius: 18px; margin: 0 auto; }
.przycisk-glos.maly .ikona { width: 32px; height: 32px; }
.lista-bledow { text-align: left; max-width: 560px; margin: 0 auto 10px; }
.blad-wiersz { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 0; border-bottom: 2px solid var(--linia); }
.rekord { font-weight: 800; color: var(--akcent-tekst); }
.przyciski.srodek { justify-content: center; }
.znajdz-polecenie { color: var(--tekst2); text-align: center; }
.znajdz-kafle { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 14px 0; }
.znajdz-kafel {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 14px 16px; border-radius: 16px;
  border: 2px solid var(--linia); background: var(--panel); cursor: pointer; box-shadow: 0 4px 0 var(--linia); font-size: 1.25rem; font-weight: 800;
}
.znajdz-kafel small { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--tekst3); }
.znajdz-kafel.pl span { color: var(--akcent-tekst); }
.znajdz-kafel:hover:not(:disabled) { border-color: var(--niebieski); }
.znajdz-kafel:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.znajdz-kafel.wybrany { border-color: var(--niebieski); background: var(--niebieski-tlo); }
.znajdz-kafel.zepsuty { border-color: var(--blad); background: var(--blad-tlo); }
.znajdz-kafel:disabled { cursor: default; }
.znajdz-dol { margin-top: 10px; }
.znajdz-dol .werdykt { flex-direction: column; gap: 4px; text-align: center; }
.gry-lista { grid-template-columns: repeat(2, 1fr); }
.znajdz-poprawka { max-width: 420px; margin: 0 auto; }
.znajdz-wyjasn { font-weight: 600; }
.boss-intro { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; }
.boss-postac { position: relative; width: 110px; height: 110px; flex: none; margin-top: 18px; }
.boss-postac::before { content: "👑"; position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 34px; }
.boss-postac.trafiony { animation: trafienie .45s ease; }
.boss-obrazenia { position: absolute; right: -36px; top: 10px; font-size: 1.5rem; font-weight: 900; color: var(--blad); animation: unies 1s ease forwards; }
@keyframes trafienie { 0%, 100% { transform: none; } 20% { transform: translateX(-8px) rotate(-4deg); } 40% { transform: translateX(8px) rotate(4deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes unies { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }
.boss-opcje { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.boss-opcja { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 16px; border: 2px solid var(--linia); background: var(--panel); cursor: pointer; box-shadow: 0 4px 0 var(--linia); text-align: left; }
.boss-opcja strong { font-size: 1.1rem; }
.boss-opcja small { color: var(--tekst2); font-weight: 700; }
.boss-opcja.wybrana { border-color: var(--akcent); background: var(--akcent-tlo); box-shadow: 0 4px 0 var(--akcent-cien); }
.boss-arena { display: flex; align-items: center; gap: 22px; max-width: 900px; margin: 0 auto 18px; padding: 18px 22px; border: 2px solid var(--linia); border-radius: 22px; background: var(--panel); }
.boss-stan { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.boss-stan strong { font-size: 1.2rem; }
.boss-stan small { color: var(--tekst2); font-weight: 800; }
.boss-hp { height: 22px; background: var(--linia); border-radius: 99px; overflow: hidden; }
.boss-hp-wypelnienie { height: 100%; background: var(--blad); border-radius: 99px; transition: width .5s ease; }
.serca { color: var(--blad); font-size: 1.4rem; letter-spacing: 2px; }
@media (max-width: 860px) { .boss-opcje { grid-template-columns: 1fr; } }

/* ---------- słówka (Poliglota) ---------- */
.pasek-jezyk { font-size: .78rem; font-weight: 800; color: var(--tekst2); padding: 8px 12px 2px; text-transform: uppercase; letter-spacing: .06em; }
.zadanie-slowka .slowko-pole { max-width: 480px; margin: 6px auto 0; }
.zadanie-slowka .pisanie-akcje > div { margin-top: 10px; }
.zdanie-zadanie { font-size: 1.3rem; line-height: 2.1; font-weight: 600; text-align: center; margin: 6px 0 4px; }
.zdanie-luka strong { color: var(--akcent-tekst); }
.pole.odpowiedz.pole-w-zdaniu { display: inline-block; width: auto; max-width: 100%; padding: 2px 8px; font-size: 1.2rem; margin: 0 4px; vertical-align: baseline; }
.definicja-tekst { font-size: 1.25rem; font-weight: 700; line-height: 1.45; color: var(--tekst); }
.zadanie-slowka .definicja-tekst { display: block; max-width: 640px; margin: 6px auto 0; }

    if (opcje.karta) {

    var wa = a.split(" "), we = e.split(" ");
    // rzeczownik: brak albo zły rodzajnik (der, die, das)

    if (toPomocniczy(we[0]) && toPomocniczy(wa[0]) && wa[0].toLowerCase() !== we[0].toLowerCase() &&

    if (toPomocniczy(we[0]) && !toPomocniczy(wa[0])) {

      if (a === bezPom || T.levenshtein(a, bezPom) <= 1) {

      var aSich = wa.some(function (w) { return w.toLowerCase() === "sich"; });

      if (!eSich && aSich) return wynik("sich_zbedne", "Tu nie ma „sich”.");

    if (wa.length === we.length && wa.slice(0, -1).join(" ") === we.slice(0, -1).join(" ") &&

  // Akceptowane formy pola w znaczeniu (bezokolicznik też może być pytaniem do wpisania).
  // Słówka: pole „en” bez osobnej listy wariantów = samo hasło.
  O.formyPola = function (z, poleId) {
    if (!z) return [];
    if (poleId === "infinitiv") return z.infinitiv ? [{ forma: z.infinitiv }] : [];
    if (poleId === "en" && !(z.en && z.en.length)) return z.infinitiv ? [{ forma: z.infinitiv }] : [];

  };

  // ---------- angielski ----------
  // Klucz porównania po angielsku: litery co do jednej, bez kropki na końcu, „to” przed czasownikiem opcjonalne (ustawienie).
  O.kluczEN = function (s, ust) {
    ust = O.ustawienia(ust);
    var k = T.klucz(s, ust.ignorujWielkoscLiter).replace(/\s*[.!]+$/, "");
    return ust.toOpcjonalne ? k.replace(/^(to|a|an|the)\s+(?=\S)/i, "") : k;

  var BRYT_AMER = [[/our\b/g, "or"], [/ise\b/g, "ize"], [/isation\b/g, "ization"], [/tre\b/g, "ter"], [/lled\b/g, "led"], [/lling\b/g, "ling"], [/ogue\b/g, "og"]];

    BRYT_AMER.forEach(function (r) { s = s.replace(r[0], r[1]); });

  }

  // Wyjaśnia błąd w słowie angielskim: podwojona litera, przestawione litery, brak / nadmiar / zła litera.
  O.diagnozaEN = function (a, e) {
    a = a.toLowerCase(); e = e.toLowerCase();
    var pojedyncze = function (s) { return s.replace(/([a-z])\1+/g, "$1"); };
    if (a !== e && wariantAmer(a) === wariantAmer(e)) return ["bryt_amer", "Pisownia brytyjska i amerykańska się różni: tu „" + e + "”."];
    if (a !== e && pojedyncze(a) === pojedyncze(e)) return ["podwojna", "Zła liczba liter (pojedyncza albo podwójna): „" + e + "”."];

      var rozne = [];
      for (var i = 0; i < a.length; i++) if (a[i] !== e[i]) rozne.push(i);
      if (rozne.length === 2 && rozne[1] === rozne[0] + 1 && a[rozne[0]] === e[rozne[1]] && a[rozne[1]] === e[rozne[0]]) return ["przestawione", "Przestawione litery: „" + e + "”."];

    if (a.length + 1 === e.length && T.levenshtein(a, e) === 1) return ["brak_litery", "Brakuje litery: „" + e + "”."];
    if (a.length === e.length + 1 && T.levenshtein(a, e) === 1) return ["zbedna_litera", "Jedna litera za dużo: „" + e + "”."];
    if (T.levenshtein(a, e) <= 2) return ["literowka", "Literówka: „" + e + "”."];

  // ---------- tłumaczenia (polski) ----------
  var OGONKI = { "ą": "a", "ć": "c", "ę": "e", "ł": "l", "ń": "n", "ó": "o", "ś": "s", "ź": "z", "ż": "z" };
  O.bezOgonkow = function (s) {
    return s.replace(/[ąćęłńóśźż]/g, function (c) { return OGONKI[c]; });

  // Klucz porównania tłumaczeń: małe litery, bez nawiasów i interpunkcji, „się”/„sobie” zawsze na końcu.
  O.kluczPL = function (s, bezOgonkow) {
    s = DT.u.nfc(s).toLowerCase().replace(/\([^)]*\)/g, " ").replace(/[.,;:!?"„”'«»…]/g, " ");

    var zwrotne = slowa.filter(function (w) { return w === "się" || w === "sie" || w === "sobie"; });
    var reszta = slowa.filter(function (w) { return !(w === "się" || w === "sie" || w === "sobie"); });
    var k = reszta.concat(zwrotne.map(function (w) { return w === "sie" ? "się" : w; })).join(" ");

  };
  O.czesciPL = function (tekst) {
    return DT.u.nfc(tekst == null ? "" : String(tekst)).split(/[,;\/]|\s+lub\s+|\s+albo\s+/)
      .map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; });
  };

  // Sprawdza tłumaczenie: wystarczy jeden wariant z listy; brak polskich znaków jest zaliczany z uwagą (ustawienie).
  O.sprawdzTlumaczenie = function (formy, odpowiedz, ust, opcje) {
    ust = O.ustawienia(ust);
    opcje = opcje || {};
    formy = formy || [];
    var wyn = { ok: false, pusta: false, czesci: [], brakujace: [], tryb: "jedna", formy: formy, tlumaczenie: true };
    var cz = O.czesciPL(odpowiedz);
    if (!cz.length) { wyn.pusta = true; wyn.komunikat = "Brak tłumaczenia."; return wyn; }
    var dokladne = formy.map(function (f) { return O.kluczPL(f.forma, false); });
    var luzne = formy.map(function (f) { return O.kluczPL(f.forma, true); });
    var trafien = 0, uwagaOgonki = false, uwagaLiterowka = false;
    cz.forEach(function (c) {
      var i = dokladne.indexOf(O.kluczPL(c, false));
      if (i < 0 && ust.tlumaczenieBezOgonkow) {
        i = luzne.indexOf(O.kluczPL(c, true));
        if (i >= 0) uwagaOgonki = true;
      }
      // jedna literówka w dłuższym polskim słowie (jak w trenerze do kartkówki)

      if (i >= 0) { trafien++; wyn.czesci.push({ tekst: c, ok: true, forma: formy[i] }); }

      if (uwagaLiterowka) wyn.uwaga = (wyn.uwaga ? wyn.uwaga + " " : "") + "Drobna literówka w polskim słowie: zaliczone.";

      for (var zi = 0; zi < karta.znaczenia.length; zi++) {
        if (zi === opcje.znaczenie) continue;
        if ((karta.znaczenia[zi].pl || []).some(function (f) { return O.kluczPL(f.forma, true) === a; })) {
          wyn.czesci[0].kod = "inne_znaczenie";
          wyn.czesci[0].opis = "To tłumaczenie innego znaczenia (" + karta.znaczenia[zi].uwagi.join("; ") + ").";

    wyn.komunikat = wyn.czesci[0].opis;
    return wyn;
  };

  O.indeksTlumaczen = function (karty) {
    var ind = {};

      k.znaczenia.forEach(function (z) {
        (z.pl || []).forEach(function (f) {

  };

  // Diagnoza dla pola po angielsku: najbliższa forma; słowo z innej karty (indeksEN) albo błąd w pisowni.
  function diagnozujEN(c, formy, ust, opcje) {

    ust = O.ustawienia(ust);
    opcje = opcje || {};
    if (opcje.rodzaj === "tlumaczenie") return O.sprawdzTlumaczenie(formy, odpowiedz, ust, opcje);
    formy = formy || [];
    var perfekt = !!opcje.perfekt;
    var wyn = { ok: false, pusta: false, czesci: [], brakujace: [], tryb: "jedna", formy: formy };

    pola.forEach(function (p) {
      var w = O.sprawdzPole(O.formyPola(karta.znaczenia[zi], p.id), odp ? odp[p.id] : "", ust, {

  O.sprawdzKarte = function (karta, odpowiedzi, ust, pola, dodatki) {
    ust = O.ustawienia(ust);
    pola = polaKarty(pola || ["praesens", "praeteritum", "perfekt"]);
    var n = karta.znaczenia.length;
    if (ust.wymagajWszystkichZnaczen && n > 1) {

    nag.forEach(function (n, i) {
      for (var k in NAGLOWKI) if (!(k in mapa) && NAGLOWKI[k].test(n)) mapa[k] = i;
    });
    var maNaglowek = "infinitiv" in mapa || "perfekt" in mapa;
    if (!maNaglowek) mapa = { infinitiv: 0, praesens: 1, praeteritum: 2, perfekt: 3 };
    var dane = maNaglowek ? wiersze.slice(1) : wiersze;
    var karty = [], klucze = {}, podgrupy = [];
    dane.forEach(function (w, i) {
      var nr = i + (maNaglowek ? 2 : 1);
      var r = {};
      ["infinitiv", "praesens", "praeteritum", "perfekt", "sekcja"].forEach(function (k) {
        r[k] = k in mapa ? (w[mapa[k]] || "").trim() : "";
      });
      if (!r.infinitiv) { ostrz.push("Wiersz " + nr + ": brak bezokolicznika, pomijam."); return; }
      ["praesens", "praeteritum", "perfekt"].forEach(function (k) {
        if (!r[k]) ostrz.push("Wiersz " + nr + " (" + r.infinitiv + "): pusta komórka " + k + ".");
      });
      var karta;
      try { karta = D.kartaZWiersza(r, nr); } catch (e) { ostrz.push("Wiersz " + nr + ": " + e.message); return; }
      if (klucze[karta.id]) { ostrz.push("Wiersz " + nr + ": duplikat „" + karta.klucz + "”, pomijam."); return; }
      klucze[karta.id] = true;
      D.podejrzane(karta).forEach(function (p) { ostrz.push("Wiersz " + nr + " (" + karta.klucz + "): " + p); });
      var g = karta.podgrupy[0];
      if (!podgrupy.some(function (x) { return x.id === g; })) {
        podgrupy.push({ id: g, nazwa: g === "glowna" ? "Lista główna" : (r.sekcja || g) });
      }

    });
    return { karty: karty, ostrzezenia: ostrz, podgrupy: podgrupy };
  };

  // Proste reguły „podejrzanych form” (nie blokują importu).
  D.podejrzane = function (karta) {
    var p = [];
    karta.znaczenia.forEach(function (z) {
      (z.perfekt || []).forEach(function (f) {
        var s0 = f.forma.split(" ")[0];
        if (f.forma && !toPom(s0)) p.push("Perfekt „" + f.forma + "” bez hat/ist.");
      });
      ["praesens", "praeteritum", "perfekt"].forEach(function (k) {
        (z[k] || []).forEach(function (f) {

          if (/ae|oe|ue/.test(f.forma) && !/(ue|oe|ae)(n|r)/.test(f.forma)) p.push(k + ": „" + f.forma + "” — może brakuje umlautu?");
          if (/\bss\b/.test(f.forma)) p.push(k + ": sprawdź ß/ss w „" + f.forma + "”.");
        });
      });

    });
    return p;
  };

  // ---------- projekt i stan użytkownika ----------

  D.wbudowane = function () {

  };

  };

  D.domyslnySzablon = function (definicja) {
    var pola = (definicja && definicja.schemat ? definicja.schemat.pola : D.SCHEMAT_CZASOWNIKI.pola)
      .filter(function (p) { return p.rodzaj !== "pytanie"; }).map(function (p) { return p.id; });
    if (definicja && definicja.schemat && definicja.schemat.typ === "slowka" && definicja.material) {

      return {
        wersja: D.WERSJA_SZABLONU, nazwa: "Kolokwium", data: "", pytanie: "pl", pola: ["en"],

      };

        podgrupy: (definicja.podgrupy || []).map(function (g) { return g.id; }),
        // próbna kartkówka: tłumaczenia w obie strony, zdania z luką, dopasowanie do definicji
        uklad: { plEn: 10, enPl: 10, luki: 5, definicje: 5 },

      };

    return {
      wersja: D.WERSJA_SZABLONU,
      nazwa: "Kartkówka",
      data: "",
      pytanie: "infinitiv",
      pola: pola,
      podgrupy: (definicja && definicja.podgrupy ? definicja.podgrupy : []).map(function (g) { return g.id; }),
      liczbaPytan: 20,

      tlumaczenie: { wymagane: false, kierunek: "DE→PL" },

    };
  };

  // Rodzaj projektu i język (projekty sprzed Poligloty: czasowniki po niemiecku).
  D.typ = function (projekt) {

  };
  D.czySlowka = function (projekt) { return D.typ(projekt) === "slowka"; };
  // Kolokwium: słówka z materiałami (teksty, zadania z zeszytu, gramatyka, wypowiedzi).
  D.material = function (projekt) { return (projekt && D.definicja(projekt).material) || null; };
  D.czyKolokwium = function (projekt) { return !!projekt && D.czySlowka(projekt) && !!D.material(projekt); };
  // Treści od AI (zdania, definicje) liczą się od razu, bez zatwierdzania (ustawienie w danych projektu).
  D.aiBezZatwierdzania = function (projekt) { return !!(projekt && D.definicja(projekt).schemat.aiBezZatwierdzania); };
  var pamiecZadan = {};
  D.zadania = function (projekt) { return (projekt && D.definicja(projekt).zadania) || []; };
  D.zadanie = function (projekt, id) {

    var c = pamiecZadan[projekt.id];

  D.domyslneUstawienia = function () {

      nazwa: opcje.nazwa || (definicja && definicja.projekt && definicja.projekt.nazwa) || "Nowy projekt",
      typ: opcje.typ || "czasowniki",
      utworzono: opcje.teraz || Date.now(),

      zrodlo: opcje.wbudowanyId ? "wbudowany" : "wlasny",
      wbudowanyId: opcje.wbudowanyId || null,
      definicja: opcje.wbudowanyId ? null : (definicja ? D.definicjaZPliku(definicja) : { schemat: U.klon(D.SCHEMAT_CZASOWNIKI), podgrupy: [{ id: "glowna", nazwa: "Lista główna" }], karty: [] }),
      ustawienia: D.domyslneUstawienia(),

    };

    }

  // Dodaje do definicji podgrupy, które występują w kartach, a nie ma ich na liście. Zwraca id dodanych.
  D.uzupelnijPodgrupy = function (def) {
    def.podgrupy = def.podgrupy || [];

        if (!def.podgrupy.some(function (x) { return x.id === g; })) {

  D.POLE_PL = { id: "pl", etykieta: "Tłumaczenie", podpowiedz: "polski bezokolicznik", rodzaj: "tlumaczenie" };

  D.definicjaZPliku = function (plik) {
    var def = D.zPodgrupami({
      schemat: U.klon(plik.projekt && plik.projekt.schemat ? plik.projekt.schemat : D.SCHEMAT_CZASOWNIKI),
      podgrupy: U.klon(plik.projekt && plik.projekt.podgrupy ? plik.projekt.podgrupy : (plik.podgrupy || [{ id: "glowna", nazwa: "Lista główna" }])),

      akceptacja: U.klon(plik.akceptacja || null),

    });

  // Dołącza tłumaczenia (plik *.tlumaczenia.json) do kart: każde znaczenie dostaje pole „pl”.
  // Tłumaczenia są osobną warstwą i nigdy nie zmieniają form z tabeli.
  D.dolaczTlumaczenia = function (def, plik) {
    var mapa = (plik && plik.karty) || {};
    var zrodlo = plik.zrodlo || "AI";
    var dolaczone = 0;
    def.karty.forEach(function (k) {
      var t = mapa[k.id];
      if (!t) return;
      k.znaczenia.forEach(function (z, i) {
        var lista = t[i] || t[0] || [];
        z.pl = lista.map(function (f) { return { forma: f, zrodlo: zrodlo, zweryfikowane: !!plik.zweryfikowane }; });
      });
      k.tlumaczenia_info = { zrodlo: zrodlo, zweryfikowane: !!plik.zweryfikowane };

    });

      if (!def.schemat.pola.some(function (p) { return p.id === "pl"; })) def.schemat.pola.push(U.klon(D.POLE_PL));

    }
    return dolaczone;
  };

  D.zPodgrupami = function (def) {

  D.znajdzWbudowany = function (id) {

  var pamiecDefinicji = {};
  // Czyści pamięć podręczną definicji (potrzebne w testach, gdy zmieniają się dane wbudowane).
  D.wyczyscPamiec = function () { pamiecDefinicji = {}; };
  // Definicja projektu: schemat, podgrupy, karty (wbudowana albo własna).
  D.definicja = function (projekt) {
    if (projekt.zrodlo === "wbudowany") {

  // Karty z nałożonymi Twoimi zmianami tłumaczeń (zatwierdzenia i poprawki z ekranu „Karty”)

  var pamiecKart = {};
  D.karty = function (projekt) {
    var bazowe = D.definicja(projekt).karty || [];

    var uzn = projekt.uznaneTlumaczenia || {};
    if (!Object.keys(wl).length && !Object.keys(popr).length && !Object.keys(uzn).length) return bazowe;

    if (c && c.bazowe === bazowe && c.rev === (projekt.tlumaczeniaRev || 0)) return c.karty;
    var karty = bazowe.map(function (k) {
      var o = wl[k.id];

      k = D.zUznanymi(k, uzn[k.id]);
      if (!o) return k;
      var kopia = {};
      for (var x in k) kopia[x] = k[x];
      kopia.znaczenia = k.znaczenia.map(function (z, i) {
        var nz = {};
        for (var y in z) nz[y] = z[y];
        if (o.znaczenia && o.znaczenia[i]) {
          nz.pl = o.znaczenia[i].map(function (f) { return { forma: f, zrodlo: "ja", zweryfikowane: true }; });
        } else if (z.pl) {

  // Uznane przez Ciebie tłumaczenia dochodzą do pierwszego znaczenia karty (źródło „ja”).
  D.zUznanymi = function (k, lista) {

      return nz;
    });
    return kopia;
  };

  // Twoje poprawki treści od AI: klucz „id|d|znaczenie” (definicja) albo „id|z|znaczenie|nr” (zdanie z luką).
  D.zPoprawkamiAI = function (k, popr) {
    var pref = k.id + "|";
    if (!Object.keys(popr).some(function (x) { return x.indexOf(pref) === 0; })) return k;
    var kopia = {};
    for (var x in k) kopia[x] = k[x];
    kopia.znaczenia = k.znaczenia.map(function (z, zi) {
      var nz = {};
      for (var y in z) nz[y] = z[y];
      var d = popr[k.id + "|d|" + zi];
      if (d && d.tekst) nz.definicja = { tekst: d.tekst, zrodlo: "ja" };
      if (z.zdania) {

        });
      }
      return nz;
    });
    return kopia;
  };

  // Poprawka treści AI (albo jej usunięcie: tekst = null); zmienia wersję, żeby pamięć kart się odświeżyła.
  D.ustawPoprawkeAI = function (projekt, klucz, tekst, odp) {
    projekt.poprawkiAI = projekt.poprawkiAI || {};
    if (tekst == null) delete projekt.poprawkiAI[klucz];
    else projekt.poprawkiAI[klucz] = { tekst: tekst, odp: odp || null, t: Date.now() };

  };

  // Zapisuje Twoje tłumaczenia karty (lista list wariantów na znaczenie) albo samo zatwierdzenie (znaczenia = null).
  D.ustawTlumaczenia = function (projekt, id, znaczenia, zweryfikowane) {

  D.maTlumaczenia = function (projekt) {

  };

  var pamiecIndeksu = {};
  D.indeksPL = function (projekt) {

  };

  // Ustawienia startowe projektu wbudowanego (z pliku *.ustawienia.json).
  D.ustawieniaStartowe = function (wbudowanyId) {
    var w = D.wbudowane().filter(function (p) { return p.projekt && p.projekt.id === wbudowanyId; })[0];
    return (w && w.ustawienia_startowe) || {};
  };

  // Jednorazowe zmiany ustawień projektu wbudowanego, np. nowy plan dnia na prośbę Aleksandra:
  // ustawienia_startowe.aktualizacje = [{wersja, opis, plan, srs, ocena, sesja}]. Każda działa raz (p.wersjaUstawien),
  // zmienia tylko podane klucze, a opis pokazuje się raz na ekranie Dziś. Nowy projekt dostaje od razu najnowsze.
  D.najnowszaWersjaUstawien = function (st) {
    return ((st && st.aktualizacje) || []).reduce(function (m, a) { return Math.max(m, a.wersja || 1); }, 1);
  };
  D.aktualizujUstawienia = function (p, teraz) {
    if (!p || !p.wbudowanyId) return false;
    var akt = (D.ustawieniaStartowe(p.wbudowanyId).aktualizacje || []).slice().sort(function (a, b) { return a.wersja - b.wersja; });
    var w = p.wersjaUstawien || 1, ostatnia = null;
    akt.forEach(function (a) {
      if (!(a.wersja > w)) return;

    else if (T.bezUmlautow(ka) === T.bezUmlautow(best.kw)) wyn.komunikat = "Umlauty (ä, ö, ü).";

    else if (ka.split(" ").slice().sort().join(" ") === best.kw.split(" ").slice().sort().join(" ")) wyn.komunikat = "Te same słowa, ale inna kolejność (szyk zdania).";
    else wyn.komunikat = wyn.drobny ? "Drobna różnica względem wzoru." : "Inaczej niż we wzorze.";
    return wyn;
  };

  // Kluczowe zwroty: czy są w odpowiedzi (bez wielkości liter). „…” w zwrocie = części w tej kolejności,
  // „ / ” = warianty (wystarczy jeden).
  K.kluczowe = function (zwroty, odp) {
    var a = " " + K.normalizuj(odp).toLowerCase().replace(/[,;:]/g, " ").replace(/\s+/g, " ") + " ";
    return (zwroty || []).map(function (z) {
      var jest = z.split(/\s+\/\s+/).some(function (wariant) {
        var czesci = wariant.toLowerCase().split(/\s*(?:\.\.\.|…)\s*/).map(function (c) { return c.replace(/[,;:]/g, " ").replace(/\s+/g, " ").trim(); }).filter(Boolean);
        var od = 0;
        return czesci.every(function (c) {
          var i = a.indexOf(c, od);
          if (i < 0) return false;
          od = i + c.length;
          return true;
        });
      });
      return { zwrot: z, jest: jest };
    });
  };

  // Luki: każda osobno, ściśle (jak słówka). Pusty wariant („∅” w danych) = w tej luce nic nie dopisujesz.
  // jezyk: „de” (domyślnie) albo „en” (porównanie po angielsku: bez kropki na końcu, wielkość liter wg ustawień).
  K.sprawdzLuki = function (zad, odpowiedzi, ust, jezyk) {
    ust = O.ustawienia(ust);
    jezyk = jezyk || "de";
    odpowiedzi = odpowiedzi || [];
    var luki = zad.luki.map(function (dobre, i) {
      var odp = String(odpowiedzi[i] == null ? "" : odpowiedzi[i]).trim();
      var pustaOk = dobre.indexOf("") >= 0;
      var formy = dobre.filter(Boolean).map(function (f) { return { forma: f }; });
      if (!odp) return { ok: pustaOk, pusta: !pustaOk, formy: formy, pustaOk: pustaOk, komunikat: pustaOk ? "" : "Brak odpowiedzi." };
      if (!formy.length) return { ok: false, formy: formy, pustaOk: true, kod: "zbedne", komunikat: "W tej luce nic nie dopisujemy.", czesci: [{ tekst: odp, ok: false }] };
      var w = O.sprawdzPole(formy, odp, ust, { jezyk: jezyk });
      w.pustaOk = pustaOk;
      return w;
    });
    var ok = luki.filter(function (l) { return l.ok; }).length;
    return { ok: ok === luki.length, punkty: ok, max: luki.length, luki: luki };
  };

  // Zadanie ułożone z kafelków: słowa wzoru (bez kropki na końcu), wymieszane inaczej niż we wzorze.
  K.kafelki = function (zad, los) {
    los = los || Math.random;
    var slowa = K.normalizuj(zad.wzory[0]).split(" ");
    if (slowa.length < 2) return slowa.slice();
    var w = slowa;
    for (var i = 0; i < 8 && w.join(" ") === slowa.join(" "); i++) w = U.tasuj(slowa, los);
    if (w.join(" ") === slowa.join(" ")) w = slowa.slice(1).concat([slowa[0]]);
    return w;
  };

  // Ocena zadania do powtórek (1 = źle, 2 = z podpowiedzią / drobny błąd, 3 = dobrze).
  K.ocenaSrs = function (ok, podpowiedz, drobny) {
    if (!ok) return drobny ? 2 : 1;
    return podpowiedz ? 2 : 3;
  };

  // ---------- kolejka nauki ----------

  // Grupy zadań z zeszytu wg tematów (grupa słówek); zadania z gramatyki mają pole „temat”.
  K.grupyZadan = function (projekt) {
    var m = DT.dane.material(projekt);
    return (m && m.grupyZadan) || [];
  };

  function zBledem(projekt, id) {
    var p = projekt.postep[id];
    return !!(p && ((p.srs && p.srs.lapsy > 0) || (p.historia || []).some(function (x) { return x.ok === false; })));
  }

  function zaczete(projekt, id) {
    var p = projekt.postep[id];
    return !!(p && p.srs && p.srs.stan !== "nowa");
  }

  // Elementy nauki dziennej: w każdym temacie najpierw słówka, potem zadania z zeszytu do tego tematu;
  // zadania z gramatyki dochodzą do powtórek, gdy je zaczniesz (na ekranie Gramatyka).
  K.elementyNauki = function (projekt, podgrupy) {
    var karty = DT.dane.kartyWZakresie(projekt, podgrupy);
    var grupy = K.grupyZadan(projekt);
    // grupy „poza planem” (np. luki powtarzające słówka) są w Ćwiczeniach i w próbnym kolokwium, ale nie w planie dnia;
    // tak samo rodzaje zadań z zeszytu wyłączone w ustawieniach planu (np. zdania na temat przy planie na 2 godziny)
    var poza = {};
    grupy.forEach(function (g) { if (g.pozaPlanem) poza[g.id] = true; });
    var rodzajePoza = K.rodzajePoza(projekt);
    var zad = DT.dane.zadania(projekt).filter(function (z) { return !poza[z.grupa] && (z.temat || rodzajePoza.indexOf(z.rodzaj) < 0); });
    var wynik = [], uzyte = {};
    var dodaj = function (x) { if (!uzyte[x.id]) { uzyte[x.id] = true; wynik.push(x); } };
    DT.dane.podgrupy(projekt).forEach(function (g) {
      if (podgrupy && podgrupy.length && podgrupy.indexOf(g.id) < 0) return;
      karty.forEach(function (k) { if ((k.podgrupy || []).indexOf(g.id) >= 0) dodaj(k); });
      grupy.filter(function (gz) { return gz.temat === g.id; }).forEach(function (gz) {
        zad.forEach(function (z) { if (z.grupa === gz.id) dodaj(z); });
      });
    });
    karty.forEach(dodaj);
    zad.forEach(function (z) {
      if (uzyte[z.id]) return;
      var gz = grupy.filter(function (x) { return x.id === z.grupa; })[0];
      // ćwiczenia z gramatyki wracają w powtórkach, gdy był w nich błąd (dobrze zrobione zostają w Materiałach i Ćwiczeniach)
      if (z.temat) { if (zaczete(projekt, z.id) && zBledem(projekt, z.id)) dodaj(z); return; }
      if (gz && gz.temat) { if (zaczete(projekt, z.id)) dodaj(z); return; }
      dodaj(z);
    });
    return wynik;
  };

  // Zakres planu dnia (ustawienia projektu): rodzaje zadań z zeszytu poza planem (plan.rodzajePoza), ile ćwiczeń
  // z każdego tematu gramatyki (plan.gramZadan, reszta zostaje w Materiałach) i które wypowiedzi (plan.wypowiedzi).
  K.rodzajePoza = function (projekt) {
    var pl = (projekt && projekt.ustawienia && projekt.ustawienia.plan) || {};
    return Array.isArray(pl.rodzajePoza) ? pl.rodzajePoza : [];
  };

  // Ćwiczenia tematu gramatyki w planie dnia: po kolei z każdego rodzaju (luki, przekształcenia, zdania, tłumaczenia),
  // najwyżej plan.gramZadan; bez limitu wszystkie.
  K.gramWPlanie = function (projekt, temat) {
    var zad = DT.dane.zadania(projekt).filter(function (z) { return z.temat === temat; });
    var pl = (projekt && projekt.ustawienia && projekt.ustawienia.plan) || {};
    var max = pl.gramZadan;
    if (!(max > 0) || zad.length <= max) return zad;
    var rodzaje = [], wg = {};
    zad.forEach(function (z) { if (!wg[z.rodzaj]) { wg[z.rodzaj] = []; rodzaje.push(z.rodzaj); } wg[z.rodzaj].push(z); });
    var wybrane = {}, n = 0;
    for (var runda = 0; n < max; runda++) {
      for (var i = 0; i < rodzaje.length && n < max; i++) {
        var z = wg[rodzaje[i]][runda];
        if (z) { wybrane[z.id] = true; n++; }
      }
    }
    return zad.filter(function (z) { return wybrane[z.id]; });
  };

  // Słówko w obie strony (fiszka + obcy → polski + polski → obcy, powtórka + krok w drugą stronę).
  K.SEK_SLOWKA = { nowe: 55, powt: 35 };
  K.sekundy = function (el, nowy, pl) {
    var r = el && K.RODZAJE[el.rodzaj] && !el.znaczenia ? K.RODZAJE[el.rodzaj] : null;
    if (r) return nowy ? r.sekNowe : r.sekPowt;
    return nowy ? K.SEK_SLOWKA.nowe : K.SEK_SLOWKA.powt;
  };

  // Minuty kolejki dnia (z czasem zależnym od rodzaju zadania).
  K.minutyKolejki = function (projekt, kolejka, elementy) {
    var pl = Object.assign({}, DT.plan.DOMYSLNE, projekt.ustawienia.plan || {});
    var poId = {};
    (elementy || K.elementyNauki(projekt)).forEach(function (e) { poId[e.id] = e; });
    var sek = 0;
    kolejka.ids.forEach(function (id) {
      var st = projekt.postep[id] && projekt.postep[id].srs;
      sek += K.sekundy(poId[id], !st || st.stan === "nowa", pl);
    });
    return Math.ceil(sek / 60);
  };

  // ---------- materiały: gramatyka, teksty, wypowiedzi ----------

  K.stan = function (projekt) {
    var s = projekt.kolokwium = projekt.kolokwium || {};
    s.gram = s.gram || {};
    s.etapy = s.etapy || {};
    s.wyp = s.wyp || {};
    return s;
  };

  K.ETAPY = { lesen: "Czytanie i słówka", hoeren: "Słuchanie (jak na kolokwium)" };

  function slowaTekstu(t) {
    return t.akapity.join(" ").split(/\s+/).filter(Boolean).length;
  }

  // Pozycje materiału do planu: tematy gramatyki, etapy tekstów (najpierw czytanie wszystkich, potem słuchanie), wypowiedzi.
  K.pozycje = function (projekt) {
    var m = DT.dane.material(projekt) || {};
    var pl = (projekt && projekt.ustawienia && projekt.ustawienia.plan) || {};
    var gram = (m.gramatyka || []).map(function (g) {
      var n = K.gramWPlanie(projekt, g.id).length;
      return { typ: "gram", id: g.id, tytul: g.tytul, min: 10 + Math.ceil(n * 40 / 60), cwiczen: n };
    });
    var teksty = (m.teksty || []);
    var etapy = [];
    ["lesen", "hoeren"].forEach(function (e) {
      teksty.forEach(function (t) {
        var slow = slowaTekstu(t);
        etapy.push({ typ: "tekst", id: t.id + "|" + e, tekst: t.id, etap: e, tytul: t.tytul,
          min: e === "lesen" ? 8 + Math.round(slow / 60) : 6 + Math.round(slow / 120) });
      });
    });
    var wyp = (m.wypowiedzi || []).filter(function (w) { return !w.dodatkowy; }).map(function (w) { return { typ: "wyp", id: w.id, tytul: w.tytul, min: 30 }; });
    // plan.wypowiedzi: które wypowiedzi mają miejsce w planie dnia (pozostałe w Materiałach; pisze się też w próbnych kolokwiach)
    if (Array.isArray(pl.wypowiedzi)) wyp = wyp.filter(function (w) { return pl.wypowiedzi.indexOf(w.id) >= 0; });
    return { gram: gram, teksty: etapy, wyp: wyp };
  };

  // Kiedy pozycja została zrobiona (czas) albo null.
  K.zrobione = function (projekt, poz) {
    var s = projekt.kolokwium || {};
    if (poz.typ === "gram") return (s.gram || {})[poz.id] || null;
    if (poz.typ === "tekst") return (s.etapy || {})[poz.id] || null;
    if (poz.typ === "wyp") { var w = (s.wyp || {})[poz.id]; return (w && w.gotowe) || null; }
    return null;
  };

  K.oznacz = function (projekt, poz, teraz) {
    var s = K.stan(projekt);
    teraz = teraz || Date.now();
    if (poz.typ === "gram") s.gram[poz.id] = s.gram[poz.id] || teraz;
    else if (poz.typ === "tekst") s.etapy[poz.id] = s.etapy[poz.id] || teraz;
    else if (poz.typ === "wyp") { var w = s.wyp[poz.id] = s.wyp[poz.id] || {}; w.gotowe = w.gotowe || teraz; w.t = w.t || teraz; }
  };

  K.cofnij = function (projekt, poz) {
    var s = K.stan(projekt);
    if (poz.typ === "gram") delete s.gram[poz.id];
    else if (poz.typ === "tekst") delete s.etapy[poz.id];
    else if (poz.typ === "wyp" && s.wyp[poz.id]) delete s.wyp[poz.id].gotowe;
  };

  // Rozkłada pozostałe pozycje równo na dni do terminu: ile na dziś, żeby zdążyć (z tym, co już dziś zrobione).
  function naDzis(pozostalo, zrobioneDzis, dni) {
    if (pozostalo <= 0) return 0;
    if (dni <= 1) return pozostalo;
    return Math.max(0, Math.min(pozostalo, Math.ceil((pozostalo + zrobioneDzis) / dni) - zrobioneDzis));
  }

  // Cel minut nauki w danym dniu: w okresie lekkim plan.minutLekko (gdy ustawione), poza nim plan.minutDziennie.
  K.celMinut = function (projekt, t) {
    var pl = (projekt && projekt.ustawienia && projekt.ustawienia.plan) || {};
    var lekko = U.zLokalnej(pl.lekkoDo);
    if (pl.minutLekko > 0 && !isNaN(lekko) && U.roznicaDni(t, lekko) >= 0) return pl.minutLekko;
    return pl.minutDziennie || 60;
  };

  K.DNI_PROBNYCH = [2, 1];   // próbne kolokwium 2 dni i 1 dzień przed kolokwium
  K.KONIEC_MATERIALU = 3;    // materiał (gramatyka, teksty, wypowiedzi) do 3. dnia przed kolokwium

  // Ustawienia planu projektu: dni próbnych kolokwiów, koniec materiału i „okres lekki” (np. angielski, gdy priorytetem
  // jest inne kolokwium): do plan.lekkoDo najwyżej plan.noweMaxDziennie nowych pozycji i plan.materialuLekko materiałów dziennie.
  K.ustawieniaPlanu = function (projekt) {
    var pl = Object.assign({}, DT.plan.DOMYSLNE, (projekt && projekt.ustawienia.plan) || {});
    return {
      pl: pl,
      dniProbnych: Array.isArray(pl.dniProbnych) && pl.dniProbnych.length ? pl.dniProbnych : K.DNI_PROBNYCH,
      koniecMaterialu: pl.koniecMaterialu != null ? pl.koniecMaterialu : K.KONIEC_MATERIALU,
      lekkoDo: U.zLokalnej(pl.lekkoDo),
      materialuLekko: pl.materialuLekko != null ? pl.materialuLekko : 1,
      lekkoTypy: Array.isArray(pl.lekkoTypy) && pl.lekkoTypy.length ? pl.lekkoTypy : ["gram", "teksty", "wyp"]
    };
  };

  // Plan dni od dziś do kolokwium. Każdy dzień: bloki {typ, id, tytul, min, zrobione}.
  // nauka = słówka i zadania (powtórki i nowe), gram/tekst/wyp = materiał, probne = próbne kolokwium, rano = rozgrzewka.
  K.plan = function (projekt, teraz, opcje) {
    opcje = opcje || {};
    var E = DT.dane.kartkowka(projekt);
    if (!E || E <= teraz) return null;
    var dzis = U.poczatekDnia(teraz);
    var kluczDzis = U.kluczDnia(teraz);
    var up = K.ustawieniaPlanu(projekt), pl = up.pl;
    var lekki = function (t) { return !isNaN(up.lekkoDo) && U.roznicaDni(t, up.lekkoDo) >= 0; };
    var poz = K.pozycje(projekt);
    var limitProbnego = (projekt.szablon && projekt.szablon.limitMin) || 90;
    var probneDzis = (projekt.symulacje || []).some(function (s) { return s.tryb === "kolokwium" && U.kluczDnia(s.t) === kluczDzis; });

    // stan kolejek materiału
    var kolejki = ["gram", "teksty", "wyp"].map(function (k) {
      var lista = poz[k];
      var typ = k;
      var zr = lista.map(function (p) { return K.zrobione(projekt, p); });
      return {
        typ: typ,
        nie: lista.filter(function (p, i) { return !zr[i]; }),
        dzis: lista.filter(function (p, i) { return zr[i] && U.kluczDnia(zr[i]) === kluczDzis; })
      };
    });

    // nauka (słówka i zadania): dziś z kolejki SRS, kolejne dni szacunkowo
    var el = K.elementyNauki(projekt, projekt.szablon && projekt.szablon.podgrupy);
    var nowe = el.filter(function (e) { var st = projekt.postep[e.id] && projekt.postep[e.id].srs; return !st || st.stan === "nowa"; });
    var srNowe = nowe.length ? nowe.reduce(function (a, e) { return a + K.sekundy(e, true, pl); }, 0) / nowe.length : pl.sekNowa;
    var srPowt = el.length ? el.reduce(function (a, e) { return a + K.sekundy(e, false, pl); }, 0) / el.length : pl.sekPowtorka;
    var noweDo = U.zLokalnej(pl.noweDo);
    var noweZostalo = nowe.length;
    // symulacja powtórek (uczciwe minuty): znane pozycje z terminem i stabilnością, nowe od dnia wprowadzenia.
    // Odstępy i wzrost stabilności jak w FSRS dla docelowej pamięci z ustawień (95%: odstęp ok. 0,46 × stabilność,
    // 90%: ok. 1 × stabilność); co trzecia nowa pozycja ma błąd przy pierwszej nauce i wraca nazajutrz,
    // a część powtórek kończy się błędem (5% przy 95%, 10% przy 90%) i wraca nazajutrz.
    // Tryb „do kolokwium”: odstęp najwyżej połowa czasu do okna końcowego, a końcowe powtórki w ostatnich dniach.
    var usrs = DT.dane.ustawieniaSrs(projekt);
    var okno = DT.srs.oknoKoncowe(E), oknoDni = Math.max(1, usrs.oknoDni || 1);
    var R = usrs.trybKartkowki !== false ? (usrs.retencjaKartkowka || 0.95) : (usrs.retencja || 0.9);
    var wsp = DT.srs.wspolczynnikOdstepu(R);
    var symul = [], nrNowej = 0, bledy = 0;
    el.forEach(function (e) {
      var st = projekt.postep[e.id] && projekt.postep[e.id].srs;
      if (st && st.stan !== "nowa") symul.push({ due: st.termin || dzis, s: Math.max(0.6, st.s || 1), sek: K.sekundy(e, false, pl) });
    });
    var sekNowaSr = srNowe, sekPowtSr = srPowt;
    function zaplanuj(x, dzienT) {
      var dni = Math.max(1, Math.round(wsp * x.s));
      var doOkna = (okno - dzienT) / U.DZIEN;
      if (doOkna >= (oknoDni > 1 ? 2 + oknoDni : 2) && dni > doOkna / 2) dni = Math.max(1, Math.floor(doOkna / 2));
      var t2 = dzienT + dni * U.DZIEN;
      if (dzienT < okno && t2 > okno) {
        var startOkna = okno - (oknoDni - 1) * U.DZIEN;
        if (oknoDni > 1 && dzienT >= startOkna - 20 * U.GODZ) {
          if (x.s < 5) t2 = okno;
        } else {
          var wcz = oknoDni > 1 ? Math.min(oknoDni - 1, DT.srs.dniPrzedOknem(x.s)) : 0;
          var cel = okno - wcz * U.DZIEN;
          t2 = cel > dzienT + 12 * U.GODZ ? cel : okno;
        }
      }
      x.due = t2;
    }
    // zwraca dodatkowe sekundy (zapomniana pozycja: jeszcze raz w tej samej sesji)
    function nastepny(x, dzienT) {
      bledy += 1 - R;
      if (bledy >= 1) {
        bledy -= 1;
        x.s = Math.max(0.6, x.s * 0.3);
        zaplanuj(x, dzienT);
        return x.sek / 2;
      }
      x.s = Math.min(365, x.s * DT.srs.wzrostStabilnosci(x.s, R));
      zaplanuj(x, dzienT);
      return 0;
    }
    function powtorkiDnia(dzienT) {
      var koniecDnia = dzienT + U.DZIEN, sek = 0, n = 0;
      // okres lekki: najwyżej powtorekMaxDziennie powtórek (najdawniej zaległe najpierw), reszta przechodzi na kolejny dzień
      var max = lekki(dzienT) && pl.powtorekMaxDziennie != null ? pl.powtorekMaxDziennie : Infinity;
      symul.filter(function (x) { return x.due < koniecDnia; }).sort(function (a, b) { return a.due - b.due; }).forEach(function (x) {
        if (n >= max) return;
        n++;
        sek += x.sek + nastepny(x, dzienT);
      });
      return { sek: sek, n: n };
    }
    function wprowadz(ile, dzienT) {
      for (var q = 0; q < ile; q++) {
        var x = { s: 4.47, sek: sekPowtSr };
        if (nrNowej++ % 3 === 0) { x.s = 0.6; x.due = dzienT + U.DZIEN; }
        else zaplanuj(x, dzienT);
        symul.push(x);
      }
    }

    var dni = [];
    var dniDo = U.roznicaDni(dzis, E);
    for (var i = 0; i <= dniDo; i++) {
      var d = new Date(dzis); d.setDate(d.getDate() + i);
      var t = d.getTime(), doE = U.roznicaDni(t, E), bloki = [];
      var klucz = U.kluczDnia(t);
      if (doE === 0) {
        bloki.push({ typ: "rano", id: "rano", tytul: "Rano: rozgrzewka (najsłabsze słówka i zadania)", min: Math.ceil(pl.kartRano * sekPowtSr / 60) });
      } else {

  // Okno dialogowe. przyciski: [{tekst, wartosc, klasa, akcja}]. Zwraca Promise z wartością (Esc = null).

  UI.okno = function (opcje) {
    return new Promise((rozwiaz) => {
      const poprzedni = document.activeElement;
      const tlo = h("div.okno-tlo");
      const zamknij = (w) => {
        document.removeEventListener("keydown", klawisz, true);
        tlo.remove();
        if (poprzedni && poprzedni.focus) poprzedni.focus();
        rozwiaz(w);
      };
      const klawisz = (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); zamknij(null); }
      };
      const przyciski = (opcje.przyciski || [{ tekst: "OK", wartosc: true, klasa: "glowny" }]).map((p) =>
        h("button.przycisk" + (p.klasa ? "." + p.klasa : ""), { type: "button", onclick: () => { zamknij(p.wartosc); if (p.akcja) p.akcja(); } }, p.tekst));

        opcje.tytul ? h("h2", opcje.tytul) : null,
        h("div.okno-tresc", opcje.tresc),
        h("div.okno-przyciski", przyciski));
      tlo.appendChild(okno);
      tlo.addEventListener("mousedown", (e) => { if (e.target === tlo) zamknij(null); });
      document.addEventListener("keydown", klawisz, true);
      document.body.appendChild(tlo);
      const fokus = okno.querySelector("input, select, textarea") || przyciski[przyciski.length - 1];
      if (fokus) fokus.focus();
      if (opcje.poOtwarciu) opcje.poOtwarciu(okno, zamknij);
    });
  };

  UI.poleOdpowiedzi = function (props) {

    }, props));

    pole.addEventListener("focus", () => { if (niemieckie()) ostatniePole = pole; });
    pole.addEventListener("keydown", (e) => {
      if (e.altKey && !e.metaKey && !e.ctrlKey && e.code === "KeyR") { e.preventDefault(); UI.powtorzMowe(); return; }
      if (niemieckie() && e.altKey && !e.metaKey && !e.ctrlKey && UMLAUTY[e.code]) {

  // ---------- mowa (TTS de-DE) ----------
  // Głos w języku projektu: niemiecki (Anna) albo brytyjski angielski (z systemu, offline).
  const glosy = {};
  function wybierzGlos(jezyk) {
    jezyk = jezyk || "de";
    if (!("speechSynthesis" in window)) return null;
    const wszystkie = speechSynthesis.getVoices();
    if (jezyk === "en") {
      const en = wszystkie.filter((g) => /^en(-|_|$)/i.test(g.lang));
      glosy.en = en.find((g) => /en[-_]GB/i.test(g.lang) && g.localService) || en.find((g) => /en[-_]GB/i.test(g.lang)) ||
        en.find((g) => /en[-_]US/i.test(g.lang) && g.localService) || en[0] || null;
      return glosy.en;
    }
    const de = wszystkie.filter((g) => /^de(-|_|$)/i.test(g.lang));
    glosy.de = de.find((g) => /anna/i.test(g.name)) || de.find((g) => /de-DE/i.test(g.lang) && g.localService) || de[0] || null;
    return glosy.de;
  }
  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    wybierzGlos("de");
    speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", () => { wybierzGlos("de"); wybierzGlos("en"); });
  }
  UI.mowaDostepna = function () { return !!(glosy.de || wybierzGlos("de")); };
  UI.ostatniaMowa = "";
  UI.powtorzMowe = function () { if (UI.ostatniaMowa) UI.mow(UI.ostatniaMowa); };
  // opcje: {jezyk, zapamietaj, tempo, poKoncu} (poKoncu: wołane po przeczytaniu, np. następny akapit).
  UI.mow = function (tekst, opcje) {
    if (opcje && opcje.zapamietaj) UI.ostatniaMowa = tekst;
    if (!("speechSynthesis" in window)) { if (opcje && opcje.poKoncu) opcje.poKoncu(false); return; }
    const jezyk = (opcje && opcje.jezyk) || UI.jezyk();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(tekst.replace(/…/g, " ").replace(/_{2,}/g, " "));
    u.lang = jezyk === "en" ? "en-GB" : "de-DE";
    const g = glosy[jezyk] || wybierzGlos(jezyk);
    if (g) { u.voice = g; u.lang = g.lang; }
    u.rate = (opcje && opcje.tempo) || 0.9;
    if (opcje && opcje.poKoncu) {
      let raz = false;
      const koniec = (ok) => { if (!raz) { raz = true; opcje.poKoncu(ok); } };
      u.onend = () => koniec(true);
      u.onerror = () => koniec(false);
    }
    speechSynthesis.speak(u);
  };
  UI.zatrzymajMowe = function () { if ("speechSynthesis" in window) speechSynthesis.cancel(); };

  // ---------- dźwięki (WebAudio, krótkie tony) ----------
  let audio = null;
  UI.dzwiek = function (rodzaj) {
    if (!DT.app || !DT.app.dzwieki()) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended" && audio.resume) audio.resume();
      const nuty = rodzaj === "ok" ? [660, 880] : rodzaj === "koniec" ? [523, 659, 784, 1047] : [220, 196];
      nuty.forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t0 = audio.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.connect(g); g.connect(audio.destination);
        o.start(t0); o.stop(t0 + 0.18);
      });
    } catch (e) { /* bez dźwięku */ }
  };

  // ---------- konfetti ----------

  const DNI = ["nd", "pn", "wt", "śr", "cz", "pt", "sb"];
  UI.dzienTyg = (t) => DNI[new Date(t).getDay()];
  UI.data = function (t) {

    return DNI[d.getDay()] + " " + d.getDate() + "." + String(d.getMonth() + 1).padStart(2, "0");
  };
  UI.dataGodzina = function (t) {

  };
  UI.odliczanie = function (ms) {
    if (ms <= 0) return "już";
    const min = Math.floor(ms / 60000), godz = Math.floor(min / 60), dni = Math.floor(godz / 24);
    if (dni >= 1) return DT.u.liczba(dni, "dzień", "dni", "dni") + " " + (godz % 24) + " godz.";
    if (godz >= 1) return godz + " godz. " + (min % 60) + " min";
    return min + " min";
  };

    sek = Math.max(0, Math.round(sek));
    return Math.floor(sek / 60) + ":" + String(sek % 60).padStart(2, "0");

  // ---------- pliki ----------
  UI.pobierzPlik = function (nazwa, tekst, typ) {
    const blob = new Blob([tekst], { type: typ || "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: nazwa });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
