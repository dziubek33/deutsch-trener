  // Udostępnia plik (telefon: „Zachowaj w Plikach”, AirDrop na Maca). Wołaj od razu w obsłudze dotknięcia, przed await.
  // Promise: "ok", "anulowano" albo null (udostępnianie plików niedostępne, np. .json w Chrome na Androidzie: pobierz plik).
  UI.udostepnijPlik = function (nazwa, tekst, typ) {
    let plik;
    try { plik = new File([tekst], nazwa, { type: typ || "application/json" }); } catch (e) { return Promise.resolve(null); }
    try {
      if (!navigator.share || !navigator.canShare || !navigator.canShare({ files: [plik] })) return Promise.resolve(null);
      return navigator.share({ files: [plik] }).then(() => "ok", (e) => (e && e.name === "AbortError" ? "anulowano" : null));
    } catch (e) { return Promise.resolve(null); }
  };

  // Na dotyku bez filtra typów: Android potrafi wyszarzyć pliki .json (zawartość i tak jest sprawdzana).
  UI.wybierzPlik = function (akceptuj) {
    return new Promise((rozwiaz) => {
      const inp = h("input", { type: "file", accept: UI.dotyk() ? "" : (akceptuj || ""),
        style: { position: "fixed", left: "-1000px", top: "0", width: "1px", height: "1px", opacity: "0" } });
      inp.addEventListener("change", () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if (!f) return rozwiaz(null);
        if (f.size > DT.magazyn.MAX_ROZMIAR) return rozwiaz({ nazwa: f.name, blad: "Plik jest za duży (limit 20 MB)." });
        const r = new FileReader();
        r.onload = () => rozwiaz({ nazwa: f.name, tekst: String(r.result) });
        r.onerror = () => rozwiaz(null);
        r.readAsText(f, "utf-8");
      });
      document.body.appendChild(inp);
      inp.click();
    });
  };

  // ---------- dotyk (telefon, tablet) ----------

/* Deutsch-Trener: wspólne komponenty nauki: fiszka (z odwracaniem i oceną 1–4) i pisanie form ze ścisłą oceną. */

    let pola = dostepne.filter((p) => (wymagane.length ? wymagane.indexOf(p.id) >= 0 : p.rodzaj !== "pytanie"));
    if (!pola.length) pola = dostepne.filter((p) => p.rodzaj !== "pytanie");

      return h("div.karta-szczegoly", h("div.szczegoly-kolumny",
        h("div", KS.tabela(projekt, k),
          h("button.przycisk.maly", { type: "button", onclick: () => KS.mowEN(KS.tekstDoMowy(projekt, k)) }, ikona("glosnik"), "Odsłuchaj"),
          h("p.zrodlo-info", "Słowo: z Twoich materiałów" + (k.zrodlo && k.zrodlo.strona ? " (" + k.zrodlo.strona + ")" : "") + ". " + (kol ? "Tłumaczenia bez znaczka są z zeszytu; tłumaczenia i zdania ze znaczkiem AI przygotował Claude." : "Tłumaczenia, definicje i zdania ze znaczkiem AI przygotował Claude."))),
        h("div",
          edytorTlumaczen(projekt, k),
          SL.definicje(projekt, k).map((x) => edytorAI(projekt, k, x, "d")),

            h("div", "Stan: ", stanOpis(projekt, k.id)),

          if (!(await DT.ui.potwierdz("Zatwierdzić treści od AI?", "Zatwierdzisz " + DT.u.liczba(tl.length, "tłumaczenie", "tłumaczenia", "tłumaczeń") + " oraz " +

    const szukaj = h("input.pole", { type: "search", placeholder: de ? "Szukaj (po niemiecku albo po polsku)…" : "Szukaj (po angielsku albo po polsku)…", value: filtrSl.tekst, "aria-label": "Szukaj",

  // Kolokwium: lista zadań z zeszytu i gramatyki z odpowiedziami, źródłem i postępem.

      h("div.gra-panel",
        h("div.boss-intro", h("div.boss-postac", DT.ui.maskotka()), h("div",
          h("p", DT.dane.czySlowka(projekt)
            ? "Odpowiadasz jak na kartkówce, a każda poprawna odpowiedź odbiera Bossowi 10 punktów życia. Żeby wygrać, potrzebujesz co najmniej 80% poprawnych odpowiedzi."
            : "Wpisujesz formy jak w symulatorze, a każda poprawna forma odbiera Bossowi 10 punktów życia. Żeby wygrać, potrzebujesz co najmniej 80% poprawnych pól."),
          h("p.przypis", "Wielkiego Bossa (cała lista) polecam dzień przed kartkówką."))),
        h("div.boss-opcje",
          opcja(10, "Mini-boss", DT.dane.czySlowka(projekt) ? "10 słówek" : "10 czasowników"),
          opcja(25, "Boss", DT.dane.czySlowka(projekt) ? "25 słówek" : "25 czasowników"),
          opcja(wszystkie.length, "Wielki Boss", "wszystkie " + wszystkie.length)),
        h("label.wybor", h("input", { type: "checkbox", onchange: (e) => { w.serca = e.target.checked; } }), "Serca: 3 życia, każdy czasownik z błędem zabiera jedno"),
        h("div.przyciski", h("button.przycisk.glowny.duzy#start-boss", { type: "button", onclick: () => walka(kont, projekt, w) }, "Do walki!", ikona("strzalka"))))));
    biezaca = { klawisz: (e) => { if (e.key === "Enter" && !DT.ui.wPolu(e)) { e.preventDefault(); walka(kont, projekt, w); return true; } return false; } };
  }

  function walka(kont, projekt, w) {
    const kolejka = DT.u.tasuj(karty(projekt)).slice(0, w.liczba);
    const slowka = DT.dane.czySlowka(projekt);
    const pola = slowka ? [null] : DT.komponenty.polaOdpowiedzi(projekt);
    const b = G.nowyBoss(kolejka.length, pola.length, w.serca);
    const start = Date.now();
    let i = 0;
    function rysuj(ostatnie) {
      DT.ui.wyczysc(kont);
      const hp = G.hp(b);
      const postac = h("div.boss-postac" + (ostatnie ? ".trafiony" : ""), DT.ui.maskotka(hp < b.max * 0.3 ? "smutny" : ""),
        ostatnie ? h("span.boss-obrazenia", "−" + ostatnie) : null);
      const pasek = h("div.boss-hp", h("div.boss-hp-wypelnienie", { style: { width: Math.round(100 * hp / b.max) + "%" } }));
      const karta = kolejka[i];
      const opcjeKomp = {
        etykieta: (slowka ? "Słówko " : "Czasownik ") + (i + 1) + " z " + kolejka.length,
        poWyniku: (r) => {
          DT.dane.zapiszOcene(projekt, karta.id, r.ok ? 3 : 1, Date.now(), r.typ || "boss", r.ok);
          const pkt = slowka ? (r.ok ? 1 : 0) : r.wynik.punkty, max = slowka ? 1 : r.wynik.max;
          const stan = G.uderz(b, pkt, max);
          i++;
          if (stan) return koniec(stan);
          rysuj(pkt * 10);
        }
      };
      const komp = slowka ? DT.komponentySlowek.zadanie(projekt, karta, DT.slowka.wybierzZadanie(projekt, karta), opcjeKomp)
        : DT.komponenty.pisanie(projekt, karta, opcjeKomp);
      kont.appendChild(h("div.gra.gra-boss",
        naglowekGry("Boss kartkówki", [b.serca != null ? h("span.serca", "♥".repeat(b.serca) + "♡".repeat(3 - b.serca)) : null]),
        h("div.boss-arena", postac, h("div.boss-stan", h("strong", "Boss Poli"), pasek, h("small", "HP " + hp + " / " + b.max))),
        komp.el));
      komp.fokus();
      biezaca = { klawisz: (e) => komp.klawisz(e) };
    }
    function koniec(stan) {
      const proc = Math.round(100 * b.poprawnePola / Math.max(1, b.wszystkiePola));
      const wyn = G.zapiszWynik(projekt, "boss", proc, Date.now(), { kart: kolejka.length, wynik: stan });
      projekt.symulacje.push({ t: Date.now(), punkty: b.poprawnePola, max: b.wszystkiePola, liczba: b.zrobione, czasSek: Math.round((Date.now() - start) / 1000), limitSek: 0, podgrupy: projekt.szablon.podgrupy, bledy: [], tryb: "boss" });
      zapiszSesje(projekt, "boss", start, b.zrobione);
      ekranKonca(kont, {
        sukces: stan === "wygrana", tytul: stan === "wygrana" ? "Boss pokonany!" : "Boss tym razem wygrał",
        kafle: [[proc + "%", slowka ? "poprawnych odpowiedzi" : "poprawnych pól"], [b.zrobione + " / " + kolejka.length, slowka ? "słówek" : "czasowników"], [G.hp(b), "HP Bossa zostało"]],
        rekord: tekstRekordu(wyn, "%"),
        jeszczeRaz: () => boss(kont, projekt)
      });
    }
    rysuj(0);
  }

  // ---------- lobby ----------
  function lobby(kont, projekt) {
    const g = G.stan(projekt);
    const dzis = g.dzis.data === DT.u.kluczDnia(Date.now()) ? g.dzis : {};
    const jedn = { sprint: " pkt", survival: "", znajdz: " pkt", boss: "%" };
    const slowka = DT.dane.czySlowka(projekt);
    const pola = DT.komponenty.polaOdpowiedzi(projekt).map((p) => p.etykieta).join(", ");
    const pytanie = (DT.dane.PYTANIA[DT.komponenty.trybPytania(projekt)] || "").toLowerCase();
    kont.appendChild(h("div.karta-panel",
      h("h2", "Gry"),
      h("p.przypis", slowka
        ? "Gry używają słówek z listy: tłumaczenie w obie strony, luki i definicje, a „Znajdź błąd” ćwiczy pisownię. Błędy z gier trafiają do powtórek."
        : "Gry działają według szablonu kartkówki: podpowiedź to " + pytanie + ", a wpisujesz " + pola + ". Błędy z gier trafiają do powtórek.")));
    kont.appendChild(h("div.gry-lista", Object.keys(G.LISTA).map((id) => h("div.gra-karta",
      h("h3", G.LISTA[id].nazwa),
      h("p", G.LISTA[id].opis),
      h("small", "Rekord: " + (g.rekordy[id] || 0) + jedn[id] + (dzis[id] != null ? " · dziś: " + dzis[id] + jedn[id] : "")),
      h("button.przycisk.glowny", { type: "button", onclick: () => DT.uklad.idz("gry", id) }, "Graj")))));
  }

  DT.ekrany.gry = {
    tytul: "Gry",
    pokaz(kont, param) {
      if (biezaca && biezaca.opusc) biezaca.opusc();
      biezaca = null;
      const projekt = DT.app.projekt();
      if (!karty(projekt).length) { kont.appendChild(h("p.pusto", "Brak kart w zakresie kartkówki.")); return; }
      ({ sprint, survival, znajdz, boss }[param] || lobby)(kont, projekt);
    },
    opusc() { if (biezaca && biezaca.opusc) biezaca.opusc(); biezaca = null; },
    klawisz(e) { return biezaca && biezaca.klawisz ? biezaca.klawisz(e) : false; }
  };
})(DT);

/* ---- 99-start.js ---- */
/* Deutsch-Trener: start aplikacji, autozapis, kopie postępu w pliku (z kartami), łączenie postępu z dwóch urządzeń
   i wersja na telefon (PWA: service worker, baner instalacji). */
(function (DT) {
  "use strict";

  const { h } = DT.ui;
  const app = {};
  let licznikZapisu = null;
  let zapisOk = true;
  let ostrzezenieZapisu = false;
  // Paczka z wbudowanymi danymi (Mac). W paczce bez danych (telefon) karty przychodzą w pliku kopii.
  let paczkaZDanymi = true;
  // Ustawienia tego urządzenia, które „Zastąp” zostawia (plik z innego urządzenia ich nie zmienia).
  const LOKALNE = ["uruchomienia", "pierwszeUruchomienie", "sciezka", "banerInstalacji"];

  app.stan = null;
  app.projekt = () => DT.dane.projekt(app.stan);
  app.dzwieki = () => !!(app.stan && app.stan.globalne.dzwieki !== false);
  app.zapisDziala = () => zapisOk;

  // Motyw: "jasny" (domyślny, zielono-biały), "ciemny" albo "system" (zgodnie z ustawieniem systemu).
  let mediaCiemny = null;
  app.ustawMotyw = function () {
    const wybor = (app.stan && app.stan.globalne.motyw) || "jasny";
    let motyw = wybor;
    if (wybor === "system") {
      mediaCiemny = mediaCiemny || (window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null);
      motyw = mediaCiemny && mediaCiemny.matches ? "ciemny" : "jasny";
    }
    document.documentElement.dataset.motyw = motyw;
    const kolor = document.querySelector('meta[name="theme-color"]');
    if (kolor) kolor.setAttribute("content", motyw === "ciemny" ? "#131f24" : "#ffffff");
  };

  app.zapiszTeraz = function () {
    clearTimeout(licznikZapisu);
    zapisOk = DT.magazyn.zapisz(app.stan);
    if (!zapisOk && !ostrzezenieZapisu) {
      ostrzezenieZapisu = true;
      DT.ui.toast("Przeglądarka nie zapisuje postępu. Zapisz kopię do pliku!", "blad");
      DT.uklad.odswiezPasek();
    }
  };

  app.zmieniono = function () {
    clearTimeout(licznikZapisu);
    licznikZapisu = setTimeout(app.zapiszTeraz, 250);
  };

  // Plik kopii: stan i karty projektów wbudowanych (żeby wersja na telefon miała czego uczyć).
  const tekstKopii = () => DT.magazyn.tekstKopii(app.stan, DT.dane.wbudowane());

  // Automatyczna kopia tylko na Macu: na telefonie pobieranie bez pytania nie działa, więc tam aplikacja przypomina.
  app.autoKopiaWlaczona = () => !!app.stan && app.stan.globalne.autoKopia !== false && !DT.ui.dotyk();

  // Automatyczna kopia postępu do pliku: raz dziennie, po pierwszej zakończonej sesji (folder Pobrane).
  app.autoKopia = function () {
    const g = app.stan.globalne;
    if (!app.autoKopiaWlaczona()) return false;
    const dzis = DT.u.kluczDnia(Date.now());
    if (g.autokopiaDzien === dzis) return false;
    g.autokopiaDzien = dzis;
    g.ostatniaKopia = Date.now();
    app.zapiszTeraz();
    DT.ui.pobierzPlik("deutsch-trener-kopia-" + dzis + ".json", tekstKopii());
    DT.ui.toast("Automatyczna kopia postępu zapisana w folderze Pobrane (raz dziennie).", "ok");
    DT.uklad.odswiezPasek();
    return true;
  };

  app.poSesji = function () {
    app.stan.globalne.ostatniaSesja = Date.now();
    app.zmieniono();
    app.autoKopia();
  };

  // Przypomnienie o kopii: była nauka od ostatniej kopii, a kopia jest starsza niż 12 h (lub jej nie ma).
  // Przy automatycznej kopii przypominamy tylko wtedy, gdy kopii nie ma od 2 dni mimo nauki (np. Safari zablokowało pobieranie).
  app.potrzebnaKopia = function () {
    const g = app.stan.globalne;
    const teraz = Date.now();
    if (!g.ostatniaSesja) return false;
    if (g.kopiaOdlozona && teraz - g.kopiaOdlozona < 2 * DT.u.GODZ) return false;
    const auto = app.autoKopiaWlaczona();
    const prog = auto ? 48 * DT.u.GODZ : 12 * DT.u.GODZ;
    if (!g.ostatniaKopia) return !auto || teraz - (g.pierwszeUruchomienie || teraz) > prog;
    return g.ostatniaSesja > g.ostatniaKopia && teraz - g.ostatniaKopia > prog;
  };

  app.odlozKopie = function () {
    app.stan.globalne.kopiaOdlozona = Date.now();
    app.zmieniono();
  };

  // Kopia do pliku. Na telefonie okno udostępniania („Zachowaj w Plikach”, AirDrop), na Macu pobranie do folderu Pobrane.
  // Wołane bezpośrednio z obsługi kliknięcia: udostępnianie wymaga dotknięcia.
  app.zapiszDoPliku = function () {
    const teraz = Date.now();
    const g = app.stan.globalne, poprzednia = g.ostatniaKopia;
    g.ostatniaKopia = teraz;
    const tekst = tekstKopii();
    const nazwa = DT.magazyn.nazwaPliku(teraz);
    const zapisano = (gdzie) => {
      g.ostatniaKopia = teraz;
      app.zapiszTeraz();
      DT.ui.toast("Zapisano kopię postępu" + (gdzie ? " (" + gdzie + ")" : "") + ".", "ok");
      DT.uklad.odswiezPasek();
      DT.uklad.odswiezBaner();
    };
    if (DT.ui.dotyk()) {
      g.ostatniaKopia = poprzednia;
      DT.ui.udostepnijPlik(nazwa, tekst).then((wynik) => {
        if (wynik === "ok") zapisano("");
        else if (wynik === null) { DT.ui.pobierzPlik(nazwa, tekst); zapisano("folder Pobrane"); }
      });
      return;
    }
    DT.ui.pobierzPlik(nazwa, tekst);
    zapisano("folder Pobrane");
  };

  app.wczytajZPliku = async function () {
    const plik = await DT.ui.wybierzPlik(".json,application/json");
    if (!plik) return;
    if (plik.blad) { DT.ui.toast(plik.blad, "blad"); return; }
    const spr = DT.magazyn.sprawdzPlik(plik.tekst);
    if (!spr.ok) { DT.ui.toast(spr.opis, "blad"); return; }
    // paczka bez danych (telefon) bierze karty z pliku; paczka z danymi (Mac) ma własne
    const karty = !paczkaZDanymi && spr.wbudowane.length ? spr.wbudowane : null;
    const znane = (karty || DT.dane.wbudowane()).map((w) => w.projekt.id);
    const bezKart = (spr.stan.projekty || []).filter((p) => p.zrodlo === "wbudowany" && znane.indexOf(p.wbudowanyId) < 0);
    const uwaga = bezKart.length
      ? " Uwaga: w pliku nie ma kart projektu „" + bezKart[0].nazwa + "” (kopia ze starszej wersji aplikacji). Zapisz kopię jeszcze raz w nowej wersji na Macu."
      : "";
    const gdzie = DT.ui.dotyk() ? "na tym urządzeniu" : "w tej przeglądarce";
    let wybor;
    if (DT.scalanie.maNauke(app.stan)) {
      wybor = await DT.ui.okno({
        tytul: "Wczytać postęp?",
        tresc: h("div", h("p", spr.opis + uwaga),
          h("p", "Postęp " + gdzie + " też jest. „Połącz” zachowa naukę z obu (przy każdej karcie liczy się nowsza odpowiedź), a „Zastąp” ustawi wszystko dokładnie jak w pliku.")),
        przyciski: [{ tekst: "Anuluj", wartosc: null }, { tekst: "Zastąp", wartosc: "zastap" }, { tekst: "Połącz", wartosc: "polacz", klasa: "glowny" }]
      });
    } else {
      wybor = (await DT.ui.potwierdz("Wczytać postęp?", spr.opis + uwaga + " Obecny postęp " + gdzie + " zostanie zastąpiony zawartością pliku.", "Wczytaj")) ? "zastap" : null;
    }
    if (!wybor) return;
    if (karty) {
      DT.magazyn.zapiszWbudowane(karty);
      DT.dane.ustawWbudowane(karty);
    }
    const g = app.stan.globalne;
    if (wybor === "polacz") {
      app.stan = DT.dane.napraw(DT.scalanie.stany(app.stan, spr.stan), Date.now());
    } else {
      app.stan = DT.dane.napraw(spr.stan, Date.now());
      LOKALNE.forEach((k) => { if (g[k] !== undefined) app.stan.globalne[k] = g[k]; else delete app.stan.globalne[k]; });
    }
    DT.trening.aktywny = null;
    app.zapiszTeraz();
    app.ustawMotyw();
    DT.uklad.odswiezPasek();
    DT.uklad.idz("dzis");
    DT.ui.toast(wybor === "polacz" ? "Połączono postęp z pliku z postępem " + gdzie + "." : "Wczytano postęp z pliku.", "ok");
  };

  function powitanie() {
    const dotyk = DT.ui.dotyk();
    const instalacja = window.DT_PWA && dotyk && !DT.ui.zEkranuPoczatkowego();
    return DT.ui.okno({
      tytul: "Witaj w Poligloci!",
      tresc: h("div.powitanie-okno", DT.ui.maskotka(),
        h("ul",
          h("li", "Start to ekran „Dziś”: plan na dziś i jeden przycisk „Zacznij”."),
          h("li", "Nowe słowa poznajesz na fiszkach, potem wpisujesz odpowiedzi. Ocena jest ścisła: liczy się każda litera (także ä, ö, ü i ß)."),
          dotyk ? [
            h("li", "Ä, ö, ü i ß wpiszesz z paska nad klawiaturą. Postęp zapisuje się sam, a kopię do pliku zrobisz w menu „Więcej”."),
            h("li", "Karty i postęp z Maca: tam „Zapisz postęp do pliku”, wyślij plik na to urządzenie (AirDrop), a tu „Mam kopię: wczytaj postęp”." +
              (instalacja ? " Najpierw dodaj aplikację do ekranu początkowego i wczytaj kopię już w niej." : ""))
          ] : [
            h("li", "Postęp zapisuje się sam w przeglądarce. Po każdej sesji zapisz też kopię do pliku (przycisk w lewym pasku)."),
            h("li", "Klawiatura: D, F, P, S, K, U przełączają ekrany, Enter zaczyna, ⌥A ⌥O ⌥U ⌥S wpisują ä ö ü ß.")
          ])),
      // wybór pliku od razu w obsłudze kliknięcia (telefon otwiera go tylko po dotknięciu)
      przyciski: [{ tekst: "Mam kopię: wczytaj postęp", wartosc: "wczytaj", akcja: app.wczytajZPliku }, { tekst: "Zaczynamy", wartosc: "start", klasa: "glowny" }]
    });
  }

  // ---------- wersja na telefon (PWA) ----------
  app.nowaWersja = false;
  app.odswiezAplikacje = function () { app.zapiszTeraz(); location.reload(); };
  app.pokazInstalacje = () => !!(window.DT_PWA && app.stan && DT.ui.dotyk() && !DT.ui.zEkranuPoczatkowego() && !app.stan.globalne.banerInstalacji);
  app.zamknijInstalacje = function () { app.stan.globalne.banerInstalacji = Date.now(); app.zmieniono(); };

  // Service worker trzyma aplikację w pamięci telefonu (działa bez internetu) i pobiera nowe wersje.
  function uruchomPWA() {
    if (!window.DT_PWA || !("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    let pierwszaInstalacja = !navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      // pierwsza instalacja to nie aktualizacja
      if (pierwszaInstalacja) { pierwszaInstalacja = false; return; }
      if (app.nowaWersja) return;
      app.nowaWersja = true;
      app.zapiszTeraz();
      DT.uklad.odswiezBaner();
    });
    navigator.serviceWorker.register("sw.js").then((reg) => {
      let sprawdzono = Date.now();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || Date.now() - sprawdzono < DT.u.GODZ) return;
        sprawdzono = Date.now();
        reg.update().catch(() => { /* bez internetu: sprawdzi następnym razem */ });
      });
    }).catch(() => { /* bez service workera aplikacja działa, tylko nie offline */ });
  }

  app.start = function () {
    const teraz = Date.now();
    paczkaZDanymi = DT.dane.wbudowane().length > 0;
    if (!paczkaZDanymi) {
      const zKopii = DT.magazyn.wczytajWbudowane();
      if (zKopii.length) DT.dane.ustawWbudowane(zKopii);
    }
    const zapisany = DT.magazyn.wczytaj();
    zapisOk = DT.magazyn.dostepny();
    app.stan = DT.dane.napraw(zapisany, teraz);
    const g = app.stan.globalne;
    g.uruchomienia = (g.uruchomienia || 0) + 1;
    g.pierwszeUruchomienie = g.pierwszeUruchomienie || teraz;
    if (g.autoKopia === undefined) g.autoKopia = true;
    // prośba o trwały zapis (przeglądarka nie usunie danych przy braku miejsca)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* bez znaczenia */ }
    const sciezka = decodeURIComponent(location.pathname || "");
    const przeniesiony = zapisany && g.sciezka && g.sciezka !== sciezka;
    g.sciezka = sciezka;
    app.zapiszTeraz();
    app.ustawMotyw();
    if (window.matchMedia) {
      const m = window.matchMedia("(prefers-color-scheme: dark)");
      const zmiana = () => { if (app.stan.globalne.motyw === "system") app.ustawMotyw(); };
      if (m.addEventListener) m.addEventListener("change", zmiana); else if (m.addListener) m.addListener(zmiana);
    }

    if (DT.ui.dotyk()) DT.ui.uruchomDotyk();
    DT.uklad.zbuduj();
    DT.uklad.odswiezPasek();
    DT.uklad.pokaz();
    if (!zapisany) powitanie();
    else if (przeniesiony) DT.ui.toast("Aplikacja jest w innym folderze niż ostatnio. Postęp się zachował.", "ok");
    window.addEventListener("pagehide", app.zapiszTeraz);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") app.zapiszTeraz(); });
    uruchomPWA();
  };

  DT.app = app;
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", app.start);
    else app.start();
  }
})(DT);
